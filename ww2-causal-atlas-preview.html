acts: {
  1:{title:'ORÍGENES',
     dek:'Dos décadas antes del primer disparo de la Segunda Guerra Mundial, las condiciones de su acto inicial ya se estaban escribiendo: en tratados, en colas del pan y en los discursos de hombres que aún no estaban en el poder.',
     eyebrow:'Antes del primer fotograma',
     intro:'Esto no es una historia, sino el <strong>planteamiento de seis</strong>: el hundimiento económico, los resentimientos y los tratados incumplidos uno tras otro que hicieron posible una segunda guerra mundial. Nada de esto era inevitable; fíjate en cómo cada fotograma estrecha el margen de lo que viene después.'},
  2:{title:'BLITZKRIEG',
     dek:'La negociación da paso a la invasión. En menos de un año Alemania arrolla casi toda la Europa continental, mientras la Unión Soviética —brevemente su socia— ve avanzar su frontera hacia el oeste, hasta que la sociedad se rompe por completo.',
     eyebrow:'Seis semanas, seis países',
     intro:'Lo que empieza como una sola invasión se amplía deprisa: Estados neutrales caen en días, Francia —de la que se esperaba que resistiera— se derrumba en seis semanas, y al final de esta bobina Alemania se ha vuelto hacia el este contra el aliado con el que firmó un pacto apenas dos años antes.'},
  3:{title:'LA GUERRA SE HACE MUNDIAL',
     dek:'Un embargo de recursos al otro lado del mundo desencadena una secuencia que convierte dos guerras separadas en una sola. A los pocos días de un ataque matutino, todas las grandes potencias de la Tierra están en guerra.',
     eyebrow:'Una mañana, dos océanos',
     intro:'Esta es la bobina más corta y la de consecuencias más amplias: un solo ataque arrastra a Estados Unidos a una guerra que había evitado, y las obligaciones de alianza hacen el resto, fundiendo la guerra en Europa y la guerra en Asia en un único conflicto global.'},
  4:{title:'EL VUELCO',
     dek:'En tres continentes a la vez, el avance del Eje se detiene y luego se invierte. Ninguna batalla concreta acaba aquí la guerra, pero al final de esta bobina el impulso ha cambiado de bando para siempre.',
     eyebrow:'La marca de la marea alta',
     intro:'Observa la secuencia: con pocos meses de diferencia, las fuerzas del Eje son detenidas en El Alamein, en Stalingrado y en Guadalcanal; tres frentes sin relación entre sí que alcanzan su límite casi al mismo tiempo.'},
  5:{title:'HUNDIMIENTO DEL EJE',
     dek:'Perdida la iniciativa, el Eje libra ya una guerra defensiva en todos los frentes a la vez. Dos ofensivas aliadas, lanzadas con pocos días de diferencia en extremos opuestos de Europa, cierran la tenaza.',
     eyebrow:'Dos frentes que se cierran',
     intro:'Fíjate otra vez en las fechas: los desembarcos de Normandía y la ofensiva soviética en Bielorrusia se abren con poco más de dos semanas de diferencia, deliberadamente escalonados para impedir que Alemania trasladara fuerzas de un frente a otro.'},
  6:{title:'DESENLACE',
     dek:'Los últimos meses de la guerra traen las batallas insulares más costosas del Pacífico, una conferencia que perfila el mundo de posguerra antes de que la guerra termine, y dos armas que la acaban en cuestión de días.',
     eyebrow:'La última bobina',
     intro:'Aquí es donde todos los hilos —Europa, el Pacífico, la diplomacia que arrancó en la Bobina I— se cierran en un solo año, con varios finales que llegan con pocos días de diferencia.'},
},

events: {
  versailles:{title:'El Tratado de Versalles', date:'junio de 1919',
    caption:'Alemania firma el tratado que pone fin a la Primera Guerra Mundial y acepta reparaciones, pérdidas territoriales y límites estrictos a su ejército.',
    detail:'El artículo 231 atribuía la responsabilidad de la guerra a Alemania y sus aliados, una cláusula que en Alemania se leyó como la exigencia de confesar una culpa exclusiva. El tratado imponía cuantiosas reparaciones, devolvía Alsacia y Lorena a Francia y limitaba el ejército alemán a 100.000 hombres, sin aviación, carros de combate ni submarinos. Lo negociaron sobre todo Gran Bretaña, Francia, Estados Unidos e Italia; Alemania quedó excluida de las conversaciones y recibió las condiciones para firmarlas.'},
  depression:{title:'La Gran Depresión', date:'1929',
    caption:'Un hundimiento económico mundial, desencadenado por el crac de Wall Street, provoca desempleo masivo e inestabilidad política en toda Europa.',
    detail:'En 1932 el paro alemán rozaba los 6 millones, cerca de un tercio de la población activa. Quebraron bancos en toda Europa central, se desplomaron las economías exportadoras y los partidos tradicionales perdieron credibilidad al no lograr frenar la caída. La crisis golpeó con especial dureza a Alemania, que todavía pagaba las reparaciones de guerra.'},
  manchuria:{title:'Japón invade Manchuria', date:'septiembre de 1931',
    caption:'El Ejército japonés ocupa Manchuria, en el nordeste de China, y establece el Estado títere de Manchukuo.',
    detail:'La invasión siguió a una explosión provocada en un ferrocarril bajo control japonés cerca de Mukden, utilizada como pretexto. La Sociedad de Naciones condenó la acción; Japón respondió retirándose de la organización en 1933. Fue la primera gran conquista territorial de una futura potencia del Eje, ocho años antes de que estallara la guerra en Europa.'},
  'hitler-power':{title:'Hitler, nombrado canciller', date:'enero de 1933',
    caption:'Adolf Hitler es nombrado canciller de Alemania y en pocos meses elimina toda oposición política.',
    detail:'Hitler fue nombrado por el presidente Hindenburg al frente de un gobierno de coalición. El incendio del Reichstag, en febrero de 1933, sirvió para justificar poderes de excepción, y la Ley Habilitante de marzo de 1933 le permitió dictar leyes sin aprobación parlamentaria, poniendo fin de hecho a la democracia alemana en menos de dos meses.'},
  rearmament:{title:'Rearme y Renania', date:'1935–1936',
    caption:'Alemania reconstruye abiertamente su ejército y envía tropas a la Renania desmilitarizada, incumpliendo Versalles sin consecuencias.',
    detail:'En 1935 se restableció el servicio militar obligatorio y se presentó públicamente la Luftwaffe, ambas cosas prohibidas por Versalles. En marzo de 1936 las tropas alemanas entraron en Renania, una zona que el tratado mantenía desmilitarizada. Francia y Gran Bretaña, absorbidas por sus propios asuntos internos, no intervinieron.'},
  'sino-japanese':{title:'Guerra total en China', date:'julio de 1937',
    caption:'Los combates en el puente de Marco Polo, cerca de Pekín, derivan en una guerra abierta entre Japón y China.',
    detail:'Lo que empezó como una escaramuza entre tropas japonesas y chinas se extendió con rapidez; a finales de 1937 Japón había tomado Shanghái y Nankín. El conflicto continuaría, en gran medida al margen de lo que ocurría en Europa, hasta fundirse con la guerra del Pacífico en 1941.'},
  anschluss:{title:'El Anschluss', date:'marzo de 1938',
    caption:'Alemania se anexiona Austria. Ninguna potencia extranjera interviene militarmente.',
    detail:'Las tropas alemanas entraron en Austria el 12 de marzo de 1938, y un plebiscito amañado celebrado al mes siguiente registró un apoyo casi unánime a la unión con Alemania. La anexión violaba explícitamente Versalles. Gran Bretaña y Francia protestaron, pero no actuaron, reforzando la pauta de una expansión sin oposición.'},
  munich:{title:'El Acuerdo de Múnich', date:'septiembre de 1938',
    caption:'Gran Bretaña, Francia, Alemania e Italia firman un acuerdo que permite a Alemania anexionarse la región checoslovaca de los Sudetes.',
    detail:'Checoslovaquia no fue parte en las negociaciones que decidieron sus fronteras. El primer ministro británico Neville Chamberlain describió el acuerdo como garantía de «la paz de nuestro tiempo». Los Sudetes contenían las principales fortificaciones fronterizas checoslovacas, que pasaron a Alemania junto con el territorio.'},
  'czech-occupy':{title:'Checoslovaquia desmantelada', date:'marzo de 1939',
    caption:'Las tropas alemanas ocupan el resto de Checoslovaquia, yendo más allá de lo concedido en Múnich.',
    detail:'La operación rompía los términos explícitos del Acuerdo de Múnich, que solo había cedido los Sudetes. Gran Bretaña respondió ofreciendo a Polonia una garantía de apoyo militar, al considerarla la siguiente de la lista; un compromiso que se pondría a prueba en menos de seis meses.'},
  'molotov-ribbentrop':{title:'El Pacto Mólotov-Ribbentrop', date:'agosto de 1939',
    caption:'Alemania y la Unión Soviética firman un pacto de no agresión, con un protocolo secreto que reparte Europa oriental en zonas de influencia.',
    detail:'Firmado por los ministros de Exteriores Viacheslav Mólotov y Joachim von Ribbentrop, el pacto público comprometía a ambas partes a no atacarse durante diez años. Un protocolo secreto, no revelado hasta después de la guerra, repartía Polonia, Finlandia, Estonia, Letonia y Lituania en zonas alemana y soviética. El pacto libraba a Alemania del riesgo de la guerra en dos frentes para la que se había preparado.'},

  'poland-invasion':{title:'Alemania invade Polonia', date:'1 sep 1939',
    caption:'Las fuerzas alemanas cruzan la frontera polaca combinando poder aéreo y blindados en un asalto veloz que después se llamaría «blitzkrieg».',
    detail:'Las fuerzas alemanas cruzaron la frontera polaca en las primeras horas del 1 de septiembre, con ataques aéreos y acorazados coordinados. Al contrario de lo que sostiene una idea muy extendida, la aviación polaca no fue destruida en tierra: se había dispersado a aeródromos de reserva camuflados antes de la invasión y siguió volando unas dos semanas. La resistencia polaca organizada se prolongó unas cinco semanas, y la última gran unidad se rindió el 6 de octubre.'},
  'declaration-war':{title:'Gran Bretaña y Francia declaran la guerra', date:'3 sep 1939',
    caption:'Tras expirar sin respuesta un ultimátum a Alemania, Gran Bretaña y Francia declaran la guerra, iniciando formalmente el conflicto europeo.',
    detail:'Gran Bretaña presentó un ultimátum exigiendo la retirada alemana de Polonia; al expirar sin respuesta, declaró la guerra, y Francia la siguió pocas horas después. Ninguno de los dos países estaba en condiciones de prestar a Polonia ayuda militar inmediata.'},
  'ussr-poland':{title:'La Unión Soviética entra en Polonia', date:'17 sep 1939',
    caption:'Las tropas soviéticas cruzan a Polonia oriental amparadas en el protocolo secreto del pacto, abriendo un segundo frente contra un Estado polaco que ya se derrumbaba.',
    detail:'Las tropas soviéticas cruzaron a Polonia oriental el 17 de septiembre, en aplicación del protocolo secreto del Pacto Mólotov-Ribbentrop. Las fuerzas polacas, ya enfrentadas a Alemania en el oeste, afrontaron un segundo frente con escasa capacidad de respuesta. Polonia quedó repartida entre Alemania y la URSS a principios de octubre.'},
  'winter-war':{title:'La Guerra de Invierno', date:'nov 1939',
    caption:'La URSS ataca Finlandia tras rechazar esta sus exigencias territoriales; la feroz resistencia finlandesa en un invierno brutal causa graves pérdidas soviéticas.',
    detail:'La URSS atacó Finlandia después de que esta rechazara las exigencias soviéticas de concesiones territoriales cerca de Leningrado. Las fuerzas finlandesas montaron una defensa inesperadamente eficaz en condiciones invernales durísimas, hasta que un tratado de paz en marzo de 1940 cedió a la URSS alrededor del 10 % del territorio finlandés.'},
  'denmark-norway':{title:'Dinamarca y Noruega ocupadas', date:'abr 1940',
    caption:'Alemania lanza operaciones simultáneas contra Dinamarca, que se rinde en unas horas, y Noruega, que resiste dos meses.',
    detail:'Alemania lanzó operaciones simultáneas contra Dinamarca, que se rindió en unas horas, y Noruega, donde los combates se prolongaron unos dos meses con apoyo británico y francés antes de su caída. La campaña aseguró a Alemania el acceso a los puertos noruegos y a las rutas del mineral de hierro sueco.'},
  'low-countries':{title:'Caen los Países Bajos', date:'may 1940',
    caption:'Alemania ataca los Países Bajos, Bélgica y Luxemburgo, y sortea la frontera fortificada francesa avanzando por el bosque de las Ardenas.',
    detail:'Las fuerzas alemanas atacaron los Países Bajos, Bélgica y Luxemburgo el 10 de mayo, evitando la fortificada Línea Maginot francesa mediante un avance por el bosque de las Ardenas, considerado intransitable para los carros de combate. Los Países Bajos se rindieron en cinco días; Bélgica resistió hasta el 28 de mayo.'},
  'france-fall':{title:'Francia se rinde', date:'jun 1940',
    caption:'Las divisiones acorazadas alemanas parten en dos a las fuerzas aliadas y alcanzan el Canal; Francia firma un armisticio a las seis semanas del inicio de la invasión.',
    detail:'Las divisiones acorazadas alemanas rompieron las líneas francesas y alcanzaron el canal de la Mancha en dos semanas, partiendo en dos a las fuerzas aliadas. Francia firmó un armisticio el 22 de junio; los dos tercios septentrionales quedaron bajo ocupación alemana, mientras un nuevo gobierno francés, con sede en Vichy, administraba el sur.'},
  'battle-britain':{title:'La Batalla de Inglaterra', date:'jul–oct 1940',
    caption:'La aviación alemana ataca aeródromos y ciudades británicas para preparar una invasión; la defensa británica aguanta y la invasión se aplaza.',
    detail:'Tras la caída de Francia, la aviación alemana lanzó una campaña sostenida contra aeródromos, infraestructuras y más tarde ciudades británicas, con el fin de lograr la superioridad aérea que exigía una invasión a través del Canal. La Royal Air Force, apoyada por una defensa dirigida por radar, infligió pérdidas suficientes para que Alemania aplazara indefinidamente sus planes de invasión.'},
  'italy-africa':{title:'Italia abre el frente norteafricano', date:'sep 1940',
    caption:'Las fuerzas italianas avanzan desde Libia hacia el Egipto británico, apuntando al canal de Suez, antes de que una contraofensiva británica las haga retroceder.',
    detail:'Las fuerzas italianas avanzaron desde Libia hacia el Egipto británico en septiembre de 1940, con la intención de amenazar el canal de Suez. El avance se estancó, y una contraofensiva británica iniciada en diciembre empujó a los italianos muy adentro de Libia, lo que llevó a Alemania a enviar refuerzos al año siguiente.'},
  tripartite:{title:'El Pacto Tripartito', date:'27 sep 1940',
    caption:'Alemania, Italia y Japón formalizan una alianza militar a tres bandas, comprometiéndose a apoyarse si una nueva potencia ataca a cualquiera de ellos.',
    detail:'Alemania, Italia y Japón formalizaron una alianza defensiva mutua, comprometiéndose a apoyarse si eran atacados por una potencia todavía no implicada en el conflicto europeo o en el chino-japonés: una cláusula dirigida sobre todo a disuadir a Estados Unidos de entrar en cualquiera de las dos guerras.'},
  'italy-greece':{title:'Italia invade Grecia', date:'28 oct 1940',
    caption:'Italia ataca Grecia desde Albania sin coordinarse con Alemania; las fuerzas griegas detienen el avance y contraatacan en territorio albanés.',
    detail:'Italia lanzó una invasión de Grecia desde la Albania bajo su control sin coordinación previa con Alemania: Hitler se enteró cuando ya había comenzado. Las fuerzas griegas detuvieron el avance y empujaron a las tropas italianas de vuelta a territorio albanés, un revés inesperado que meses después arrastraría a las fuerzas alemanas a los Balcanes.'},
  'yugoslavia-greece':{title:'Alemania ocupa Yugoslavia y Grecia', date:'abr 1941',
    caption:'Alemania invade ambos países en cuestión de semanas y rescata la estancada campaña italiana en Grecia, pocas semanas antes de que comience la invasión de la Unión Soviética.',
    detail:'Tras un golpe de Estado en Yugoslavia que derribó a un gobierno alineado con el Eje, y para rescatar la estancada campaña italiana en Grecia, Alemania invadió ambos países en abril de 1941. Los dos fueron ocupados en pocas semanas. Barbarroja comenzó después unas cinco semanas más tarde de lo previsto en un principio, aunque cuánto de ese retraso causaron realmente los Balcanes es objeto de debate: también se señalan un deshielo primaveral inusualmente tardío y una logística sin terminar.'},
  barbarossa:{title:'Operación Barbarroja', date:'22 jun 1941',
    caption:'Alemania rompe su pacto con la Unión Soviética y lanza la mayor invasión terrestre de la historia en un frente que va del Báltico al mar Negro.',
    detail:'Alemania lanzó la mayor invasión terrestre de la historia, con más de tres millones de soldados. Los avances iniciales fueron rápidos y cercaron a grandes contingentes soviéticos, pero no se cumplió el calendario de la campaña, concebida para derrotar a la URSS antes del invierno.'},
  'moscow-battle':{title:'La Batalla de Moscú', date:'oct 1941–ene 1942',
    caption:'Las fuerzas alemanas llegan a las afueras de la capital soviética antes de ser detenidas por la resistencia, el agotamiento y un invierno para el que no estaban preparadas.',
    detail:'Las fuerzas alemanas avanzaron hasta avistar Moscú a principios de diciembre, antes de ser detenidas por una resistencia soviética cada vez más firme, el agotamiento, la falta de suministros y un invierno severo para el que no iban equipadas. Una contraofensiva soviética hizo retroceder las líneas alemanas alejándolas de la capital.'},

  'oil-embargo':{title:'El embargo petrolero de EE. UU. a Japón', date:'ago 1941',
    caption:'Tras ocupar Japón el sur de la Indochina francesa, EE. UU., Gran Bretaña y los Países Bajos congelan los activos japoneses y cortan las exportaciones de petróleo.',
    detail:'Después de que Japón ocupara el sur de la Indochina francesa, Estados Unidos, Gran Bretaña y los Países Bajos congelaron los activos japoneses y embargaron las exportaciones de petróleo, un recurso que Japón importaba casi en su totalidad. Los planificadores japoneses consideraron insostenible mantener las operaciones en China sin asegurarse fuentes alternativas de petróleo, sobre todo en el Sudeste Asiático.'},
  'pearl-harbor':{title:'Ataque a Pearl Harbor', date:'7 dic 1941',
    caption:'La aviación embarcada japonesa golpea a la Flota del Pacífico estadounidense en Hawái, hundiendo o dañando ocho acorazados, pero sin alcanzar a los portaaviones, que estaban en el mar.',
    detail:'La aviación japonesa embarcada atacó a la Flota del Pacífico estadounidense fondeada en Hawái sin que llegara a Washington una declaración de guerra antes del inicio del ataque. La incursión hundió o dañó ocho acorazados y causó más de 2.400 muertos, pero no alcanzó a los portaaviones de la flota, que se encontraban en el mar.'},
  'us-enters':{title:'Estados Unidos declara la guerra', date:'8 dic 1941',
    caption:'El Congreso aprueba la declaración de guerra a Japón al día siguiente de Pearl Harbor, poniendo fin a la neutralidad estadounidense.',
    detail:'El presidente Roosevelt pidió al Congreso una declaración de guerra al día siguiente del ataque, calificando el 7 de diciembre como «una fecha que vivirá en la infamia». La declaración se aprobó con un apoyo casi unánime y puso fin a la neutralidad estadounidense en el conflicto.'},
  'axis-declare-us':{title:'Alemania e Italia declaran la guerra a EE. UU.', date:'11 dic 1941',
    caption:'En cumplimiento del Pacto Tripartito, Alemania e Italia declaran la guerra a Estados Unidos, fundiendo las guerras europea y del Pacífico en un solo conflicto.',
    detail:'Alemania e Italia declararon la guerra a Estados Unidos cuatro días después de Pearl Harbor, en cumplimiento de sus obligaciones del Pacto Tripartito, aunque los términos del pacto se aplicaban técnicamente solo a situaciones defensivas. Las declaraciones fundieron formalmente los conflictos europeo y del Pacífico en una única guerra mundial.'},
  'japan-expansion':{title:'Japón arrasa el Sudeste Asiático', date:'dic 1941–may 1942',
    caption:'En los seis meses siguientes a Pearl Harbor, Japón toma Filipinas, Malaya, Singapur, Hong Kong, Birmania y las Indias Orientales Neerlandesas.',
    detail:'En los seis meses siguientes a Pearl Harbor, Japón tomó Filipinas, la Malaya británica y Singapur, Hong Kong, Birmania y las Indias Orientales Neerlandesas, asegurándose el petróleo, el caucho y otros recursos que le había negado el embargo. La rápida conquista dejó a Japón controlando un vastísimo perímetro defensivo en el Pacífico y el Sudeste Asiático.'},

  midway:{title:'La Batalla de Midway', date:'jun 1942',
    caption:'Los criptógrafos estadounidenses anticipan un ataque japonés a Midway; se hunden cuatro portaaviones de flota japoneses, una pérdida de la que su aviación naval nunca se recupera.',
    detail:'Los criptógrafos estadounidenses habían descifrado parcialmente las comunicaciones navales japonesas, lo que permitió a la Flota del Pacífico anticipar un ataque japonés al atolón de Midway y situar sus portaaviones para una emboscada. Se hundieron cuatro portaaviones de flota japoneses a cambio de uno estadounidense: una pérdida de la que la aviación naval japonesa nunca se recuperó del todo.'},
  'el-alamein':{title:'La Batalla de El Alamein', date:'oct–nov 1942',
    caption:'Las fuerzas de la Commonwealth británica detienen el avance germano-italiano hacia Suez y después empujan al Eje a través de Libia.',
    detail:'Las fuerzas de la Commonwealth británica al mando del general Montgomery detuvieron en El Alamein el avance germano-italiano hacia el canal de Suez, y a continuación lanzaron una contraofensiva que en los meses siguientes empujó a las fuerzas del Eje a través de Libia.'},
  torch:{title:'Operación Torch', date:'nov 1942',
    caption:'Fuerzas estadounidenses y británicas desembarcan en el África del Norte francesa, atrapando al Eje entre dos frentes que avanzan.',
    detail:'Fuerzas estadounidenses y británicas desembarcaron en varios puntos de la costa del África del Norte francesa, entonces bajo control de la Francia de Vichy. Tras una breve resistencia, las fuerzas francesas allí destacadas se unieron a los Aliados y, junto con el avance británico desde Egipto, atenazaron al Eje desde dos direcciones.'},
  stalingrad:{title:'La Batalla de Stalingrado', date:'ago 1942–feb 1943',
    caption:'Meses de combate calle por calle terminan con el Sexto Ejército alemán cercado y obligado a rendirse: una de las mayores pérdidas militares alemanas de la guerra.',
    detail:'Las fuerzas alemanas combatieron calle por calle para tomar la ciudad, inmovilizando al Sexto Ejército durante el otoño de 1942. Una contraofensiva soviética en noviembre cercó a unos 250.000 soldados del Eje; los supervivientes se rindieron en febrero de 1943.'},
  guadalcanal:{title:'La Batalla de Guadalcanal', date:'ago 1942–feb 1943',
    caption:'Seis meses de combates por un solo aeródromo terminan con la retirada japonesa: la primera ofensiva terrestre aliada sostenida contra Japón.',
    detail:'Los marines estadounidenses desembarcaron en Guadalcanal para tomar un aeródromo que Japón estaba construyendo allí, iniciando seis meses de intensos combates terrestres, navales y aéreos por la isla. La retirada japonesa marcó la primera ofensiva terrestre aliada sostenida de la guerra del Pacífico. (La primera derrota terrestre infligida a fuerzas japonesas se había producido semanas antes en Milne Bay, en Nueva Guinea, donde tropas australianas rechazaron un desembarco en agosto y septiembre de 1942.)'},
  'axis-africa-surrender':{title:'El Eje se rinde en África', date:'may 1943',
    caption:'Atrapadas entre dos ejércitos aliados en avance, las tropas alemanas e italianas que quedan en Túnez se rinden y termina la campaña africana.',
    detail:'Atrapadas entre las fuerzas británicas que avanzaban desde Egipto y las angloamericanas desde el oeste, las tropas alemanas e italianas que quedaban en Túnez se rindieron, poniendo fin a la presencia del Eje en África y entregando unos 250.000 prisioneros.'},
  sicily:{title:'Desembarcos aliados en Sicilia', date:'jul 1943',
    caption:'Los Aliados aseguran Sicilia en seis semanas en la mayor operación anfibia hasta la fecha; el gobierno de Mussolini cae dos semanas después de iniciarse.',
    detail:'Las fuerzas aliadas desembarcaron en Sicilia los días 9 y 10 de julio en la mayor operación anfibia de la guerra hasta ese momento, y aseguraron la isla en seis semanas. La invasión derribó a Mussolini en unas dos semanas: el Gran Consejo Fascista votó en su contra y el rey lo destituyó y detuvo el 25 de julio.'},
  kursk:{title:'La Batalla de Kursk', date:'jul 1943',
    caption:'La ofensiva alemana de blindados en masa, anticipada por la inteligencia soviética, acaba en derrota y entrega definitivamente la iniciativa a la URSS.',
    detail:'Alemania intentó eliminar un saliente soviético cerca de Kursk con una ofensiva acorazada masiva, anticipada por la inteligencia soviética, que había preparado líneas defensivas en profundidad. La batalla, con miles de carros de combate implicados, terminó en victoria soviética y desplazó de forma permanente la iniciativa estratégica en el frente oriental.'},
  'italy-surrender':{title:'Italia se rinde', date:'sep 1943',
    caption:'El nuevo gobierno italiano pacta en secreto un armisticio con los Aliados; Alemania responde ocupando rápidamente la península.',
    detail:'Tras la destitución de Mussolini, el nuevo gobierno italiano negoció en secreto un armisticio con los Aliados. Las fuerzas alemanas, que se lo esperaban, ocuparon rápidamente casi toda la península italiana y siguieron combatiendo allí junto a los fascistas que permanecieron leales.'},
  'island-hopping':{title:'Comienza el «salto de isla en isla»', date:'1943–44',
    caption:'En vez de asaltar cada isla en manos japonesas, las fuerzas estadounidenses toman unas y evitan otras, aislando las plazas fuertes de todo reabastecimiento.',
    detail:'En lugar de asaltar todas las islas en manos japonesas, las fuerzas estadounidenses tomaban selectivamente las de utilidad estratégica y dejaban atrás las más fortificadas, aislándolas de suministros y refuerzos. La estrategia permitió avanzar más deprisa hacia Japón reduciendo las bajas en los puntos fuertes evitados.'},

  dday:{title:'Día D: los desembarcos de Normandía', date:'6 jun 1944',
    caption:'Los Aliados desembarcan en cinco playas de Normandía tras una campaña de engaño que convence al mando alemán de que la invasión principal llegaría por Calais.',
    detail:'Las fuerzas aliadas desembarcaron en cinco sectores de playa de la costa normanda, con apoyo de tropas aerotransportadas y de una campaña de engaño que había convencido al mando alemán de que la invasión principal llegaría más al norte, por Calais. Consolidar una cabeza de playa segura abrió un segundo frente estable en Europa occidental.'},
  bagration:{title:'Operación Bagration', date:'jun 1944',
    caption:'Coordinada con los desembarcos de Normandía, una enorme ofensiva soviética destruye buena parte del Grupo de Ejércitos Centro alemán en Bielorrusia.',
    detail:'Concebida para coincidir con los desembarcos de Normandía, la ofensiva soviética en Bielorrusia destruyó una parte sustancial del Grupo de Ejércitos Centro alemán, con pérdidas comparables o superiores a las de Stalingrado, y empujó a las fuerzas alemanas hacia Polonia.'},
  'paris-liberated':{title:'París es liberada', date:'ago 1944',
    caption:'Un alzamiento de la resistencia coincide con la llegada de las tropas aliadas; la guarnición alemana se rinde en vez de destruir la ciudad como se le había ordenado.',
    detail:'Mientras las fuerzas aliadas avanzaban desde Normandía, un alzamiento de la resistencia francesa en París coincidió con la llegada de tropas de la Francia Libre y estadounidenses, y el comandante alemán entregó la ciudad en lugar de cumplir la orden de demolición de Hitler, aunque se discute cuánta capacidad destructiva conservaba realmente la guarnición.'},
  'leyte-gulf':{title:'La Batalla del Golfo de Leyte', date:'oct 1944',
    caption:'La mayor batalla naval de la guerra deja a la marina japonesa incapaz de emprender otra gran operación, y ve los primeros ataques kamikaze organizados.',
    detail:'En la mayor batalla naval de la guerra, Japón comprometió casi toda su flota restante en un intento de destruir a las fuerzas estadounidenses que apoyaban la invasión de Filipinas. La batalla incluyó los primeros ataques kamikaze organizados y dejó a la marina japonesa incapaz de emprender otra gran operación durante el resto de la guerra.'},
  bulge:{title:'La Batalla de las Ardenas', date:'dic 1944–ene 1945',
    caption:'La última gran ofensiva alemana en el oeste busca partir las líneas aliadas; la resistencia creciente y la mejora del tiempo la desgastan en seis semanas.',
    detail:'Alemania concentró fuerzas para una ofensiva sorpresa a través del bosque de las Ardenas, con el objetivo de partir las líneas aliadas y recuperar el puerto de Amberes. Los avances iniciales crearon una bolsa visible en las líneas aliadas, pero la resistencia creciente, los refuerzos y el despeje del tiempo, que permitió el apoyo aéreo aliado, desgastaron la ofensiva en seis semanas.'},

  yalta:{title:'La Conferencia de Yalta', date:'feb 1945',
    caption:'Roosevelt, Churchill y Stalin se reúnen para planificar la Alemania de posguerra, las fronteras de Polonia y la entrada soviética en la guerra contra Japón.',
    detail:'Con la derrota alemana cada vez más segura, Roosevelt, Churchill y Stalin se reunieron en Crimea para tratar la división de Alemania en la posguerra, las fronteras de Polonia, la estructura de las Naciones Unidas y la entrada soviética en la guerra contra Japón en los tres meses siguientes a la rendición alemana.'},
  'iwo-jima':{title:'La Batalla de Iwo Jima', date:'feb–mar 1945',
    caption:'Los marines estadounidenses toman la isla fortificada, valiosa por sus aeródromos, frente a una guarnición japonesa atrincherada en una extensa red de túneles.',
    detail:'Los marines estadounidenses desembarcaron en la pequeña isla volcánica, valiosa por unos aeródromos situados a distancia de caza de Japón, frente a una guarnición japonesa atrincherada en una extensa red de túneles. Murió casi toda la guarnición japonesa, y las bajas estadounidenses fueron también muy elevadas en relación con el tamaño de la isla.'},
  okinawa:{title:'La Batalla de Okinawa', date:'abr–jun 1945',
    caption:'La mayor campaña anfibia estadounidense de la guerra del Pacífico trae ataques kamikaze sostenidos y grandes pérdidas para todos durante casi tres meses.',
    detail:'La invasión de Okinawa, concebida como base para una eventual invasión de las islas metropolitanas japonesas, sufrió ataques kamikaze sostenidos contra la flota y dejó numerosas bajas entre combatientes japoneses y aliados y entre la población civil de Okinawa por igual: unas cifras que después alimentarían las estimaciones del coste de invadir Japón directamente.'},
  'berlin-fall':{title:'La caída de Berlín', date:'abr–may 1945',
    caption:'Las fuerzas soviéticas cercan Berlín y combaten manzana a manzana; Hitler se quita la vida y la guarnición de la ciudad se rinde pocos días después.',
    detail:'Las fuerzas soviéticas cercaron Berlín a finales de abril de 1945 y combatieron manzana a manzana por la ciudad. Con las tropas soviéticas a pocas manzanas de su búnker y sin perspectiva de auxilio, Hitler se quitó la vida el 30 de abril; la guarnición de la ciudad se rindió pocos días después.'},
  've-day':{title:'Día de la Victoria en Europa: Alemania se rinde', date:'7–8 may 1945',
    caption:'Los mandos alemanes firman los instrumentos de rendición incondicional y termina formalmente la guerra en Europa, mientras continúa la del Pacífico.',
    detail:'Tras la muerte de Hitler y la caída de Berlín, los mandos alemanes firmaron los instrumentos de rendición incondicional, poniendo fin formal a la guerra en Europa. Estallaron celebraciones en los países aliados, aunque la guerra contra Japón continuaba.'},
  hiroshima:{title:'El bombardeo atómico de Hiroshima', date:'6 ago 1945',
    caption:'Estados Unidos lanza sobre Hiroshima la primera arma atómica empleada en una guerra y destruye la mayor parte de la ciudad.',
    detail:'Estados Unidos lanzó una bomba atómica sobre Hiroshima, una ciudad de unos 350.000 habitantes, destruyendo la mayor parte de la ciudad y causando entre 70.000 y 140.000 muertos antes de que acabara el año, por la explosión y sus secuelas. Fue el primer uso de un arma nuclear en una guerra.'},
  'ussr-japan':{title:'La Unión Soviética declara la guerra a Japón', date:'8 ago 1945',
    caption:'Cumpliendo su compromiso de Yalta, la URSS invade la Manchuria ocupada por Japón y elimina toda posibilidad de una paz mediada por Moscú.',
    detail:'Cumpliendo su compromiso de Yalta, la Unión Soviética declaró la guerra a Japón y lanzó una gran ofensiva sobre la Manchuria ocupada por los japoneses, arrollando rápidamente a las fuerzas allí destacadas y eliminando toda perspectiva de una paz negociada con mediación de Moscú, que algunos dirigentes japoneses habían estado buscando.'},
  nagasaki:{title:'El bombardeo atómico de Nagasaki', date:'9 ago 1945',
    caption:'Tres días después de Hiroshima, se lanza una segunda bomba atómica sobre Nagasaki mientras la cúpula japonesa delibera sobre la rendición.',
    detail:'Tres días después de Hiroshima, Estados Unidos lanzó una segunda bomba atómica sobre Nagasaki, que causó entre 40.000 y 80.000 muertos antes de que acabara el año. La cúpula japonesa, que ya sopesaba la rendición, deliberó durante los días siguientes.'},
  'japan-surrender':{title:'Japón anuncia la rendición', date:'15 ago 1945',
    caption:'El emperador Hirohito anuncia por radio la aceptación de las condiciones de rendición: la primera vez que la mayoría de los ciudadanos oía su voz.',
    detail:'El emperador Hirohito anunció la aceptación japonesa de las condiciones aliadas de rendición en una alocución radiofónica al pueblo japonés, la primera vez que la mayoría de los ciudadanos oía su voz. Los combates cesaron en su mayor parte, aunque quedaba por firmar el documento formal de rendición.'},
  'vj-day':{title:'Rendición formal de Japón', date:'2 sep 1945',
    caption:'Los representantes japoneses firman el Instrumento de Rendición a bordo del USS Missouri, en la bahía de Tokio, y termina formalmente la Segunda Guerra Mundial.',
    detail:'Los representantes japoneses firmaron el Instrumento de Rendición a bordo del USS Missouri, en la bahía de Tokio, poniendo fin formal a la Segunda Guerra Mundial: un conflicto que, según la mayoría de las estimaciones, causó entre 70 y 85 millones de muertos en todo el mundo.'},
},

applyLocale();   // merge the active language over the English data before rendering

const eventById = Object.fromEntries(events.map(e => [e.id, e]));
const linksData = links.map(l => ({...l}));

/* ================= SOURCES: shared renderer for both modes ================= */
const kindLabel = kind => t('src.kind.' + kind);

function srcLink(id){
  const s = SOURCES[id];
  if (!s) return '';
  return `<a class="src-link" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a>`
       + `<span class="src-pub">${s.pub}</span>`
       + `<span class="src-kind" data-kind="${s.kind}">${kindLabel(s.kind)}</span>`;
}

// Returns the "Sources" block for an event: any claim-level notes first, then
// the list of works supporting that event's caption and detail text.
function sourcesHTML(eventId){
  const ids = (typeof eventSources !== 'undefined' && eventSources[eventId]) || [];
  const notes = (typeof claimNotes !== 'undefined' && claimNotes[eventId]) || [];
  if (!ids.length && !notes.length) return '';
  let html = `<div class="src-block">`;
  notes.forEach(n => {
    html += `<div class="src-note">`
         +  `<div class="src-note-label">${t('src.noteOn', {claim: n.claim})}</div>`
         +  `<p>${n.note}</p>`
         +  `<ul class="src-list">${n.sources.map(s => `<li>${srcLink(s)}</li>`).join('')}</ul>`
         +  `</div>`;
  });
  if (ids.length){
    html += `<div class="src-head">${t('src.sources')}</div>`
         +  `<ul class="src-list">${ids.map(s => `<li>${srcLink(s)}</li>`).join('')}</ul>`
         +  `<a class="src-all" href="references.html" target="_blank" rel="noopener">${t('src.all')}</a>`;
  }
  return html + `</div>`;
}

/* ================= EXPLORE MODE: GRAPH ================= */
let svg, gRoot, simulation, nodesData, linkSel, nodeSel, labelSel;
let gLand, gGrat, gStems, stemSel, projection, geoPath;
let layout = 'map';            // 'map' = geographic, 'network' = force-directed

/* The events span nearly the whole globe. Centring on 145E puts the
   antimeridian cut in the mid-Atlantic — the emptiest stretch for this
   dataset — giving Europe on the left, the Pacific centre-right and the
   Americas on the right, with nothing sliced in half. */
const MAP_ROTATE = [-145, 0];

function buildProjection(){
  const w = svg.node().clientWidth || 900, h = svg.node().clientHeight || 500;
  // Frame to the land itself rather than the whole sphere — Antarctica is
  // already dropped from the basemap, so this fills the pane with the part
  // of the world the war actually happened in.
  const extent = {type:'GeometryCollection',
    geometries: LAND.map(ring => ({type:'Polygon', coordinates:[ring]}))};
  projection = d3.geoEquirectangular().rotate(MAP_ROTATE)
    .fitExtent([[16, 16], [w - 16, h - 16]], extent);
  geoPath = d3.geoPath(projection);
}
// Projected screen position of an event's true coordinates.
function geoXY(id){
  const g = EVENT_GEO[id];
  if (!g || !projection) return null;
  const p = projection([g.lon, g.lat]);
  return p && isFinite(p[0]) && isFinite(p[1]) ? p : null;
}
function drawBasemap(){
  if (!gLand) return;
  buildProjection();
  gLand.selectAll('path').data(LAND).join('path')
    .attr('d', d => geoPath({type:'Polygon', coordinates:[d]}));
  gGrat.selectAll('path').data([d3.geoGraticule().step([30, 30])()])
    .join('path').attr('d', geoPath);
}

function initGraph(){
  svg = d3.select('#graph-svg');
  gRoot = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.3, 8]).on('zoom', (event) => {
    gRoot.attr('transform', event.transform);
    // once zoomed in there's room for every label, so bring them all back
    svg.node().classList.toggle('labels-on', event.transform.k >= 2.2);
  }));

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -4 8 8').attr('refX',17).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4').attr('fill','#8C6B33');

  Object.entries(icons).forEach(([key, svgStr]) => {
    const inner = svgStr.replace(/^<svg viewBox="([^"]+)">/, '').replace(/<\/svg>$/, '');
    const symbol = defs.append('symbol').attr('id', 'icon-' + key).attr('viewBox', '0 0 100 100');
    symbol.node().innerHTML = inner;
  });

  // basemap layers sit underneath the network
  gLand  = gRoot.append('g').attr('class','land-layer');
  gGrat  = gRoot.append('g').attr('class','graticule-layer');
  gStems = gRoot.append('g').attr('class','stem-layer');
  drawBasemap();

  nodesData = events.map(e => ({...e}));
  // seed each node at its map position so the first tick doesn't fly in
  nodesData.forEach(d => { const p = geoXY(d.id); if (p){ d.x = p[0]; d.y = p[1]; } });

  simulation = d3.forceSimulation(nodesData)
    .force('link', d3.forceLink(linksData).id(d => d.id).distance(80).strength(0.35))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('x', d3.forceX().x(d => xForYear(d.year)).strength(0.55))
    .force('y', d3.forceY().y(0).strength(0.06))
    .force('collide', d3.forceCollide().radius(22));

  // hairlines from a node to its true coordinate, when crowding pushes it off
  stemSel = gStems.selectAll('line').data(nodesData).join('line').attr('class','geo-stem');

  linkSel = gRoot.append('g').selectAll('path').data(linksData).join('path')
    .attr('class','link').attr('stroke','#8C6B33').attr('stroke-width',1).attr('marker-end','url(#arrow)');

  nodeSel = gRoot.append('g').selectAll('g').data(nodesData).join('g').attr('class','node')
    .call(d3.drag()
      .on('start', (event,d) => { if (!event.active) simulation.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (event,d) => { d.fx=event.x; d.fy=event.y; })
      .on('end', (event,d) => { if (!event.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

  nodeSel.append('circle')
    .attr('class', d => 'node-ring' + (isApprox(d.id) ? ' node-approx' : ''))
    .attr('r', 10)
    .attr('fill', d => THEATERS[d.theater].hex).attr('fill-opacity', 0.22)
    .attr('stroke', d => THEATERS[d.theater].hex).attr('stroke-width', 1.3);

  nodeSel.append('use')
    .attr('href', d => '#icon-' + (d.icon || 'spark'))
    .attr('width', 13).attr('height', 13).attr('x', -6.5).attr('y', -6.5)
    .attr('color', d => THEATERS[d.theater].hex)
    .style('stroke', d => THEATERS[d.theater].hex);

  nodeSel.on('click', (event,d) => { selectEvent(d.id); event.stopPropagation(); });
  nodeSel.on('mouseenter', (event,d) => showLabels([d.id, state.selected]))
         .on('mouseleave', () => showLabels([state.selected]));
  nodeSel.append('title').text(d => d.title);

  labelSel = gRoot.append('g').selectAll('text').data(nodesData).join('text')
    .attr('class','node-label').attr('dx',12).attr('dy',3)
    .text(d => d.title.length > 26 ? d.title.slice(0,25)+'…' : d.title);

  svg.on('click', () => selectEvent(null));

  simulation.on('tick', renderPositions);

  applyLayout();
  updateVisibility();
}

// Where the event sits on the map, and — just as important — what that dot
// is actually claiming. Only shown in map layout, where the claim is made.
function placeHTML(id){
  if (layout !== 'map') return '';
  const g = EVENT_GEO[id];
  if (!g) return '';
  const p = GEO_PRECISION[g.precision] || {};
  return `<div class="ex-place"><span class="pin">&#9679;</span> ${g.place}`
       + (p.blurb ? `<em>${p.blurb}</em>` : '') + `</div>`;
}

// Paints current node/link positions. Driven by the simulation tick, but also
// called directly so the map is correct the instant you switch to it, without
// waiting for the simulation to settle.
function renderPositions(){
  if (!nodeSel) return;
  linkSel.attr('d', d => {
    const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, dr=Math.sqrt(dx*dx+dy*dy)*1.6;
    return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
  });
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  // hairline back to the true coordinate, when crowding has pushed a node off it
  stemSel.each(function(d){
    const p = layout === 'map' ? geoXY(d.id) : null;
    const show = p && Math.hypot(p[0]-d.x, p[1]-d.y) > 6;
    d3.select(this).attr('display', show ? null : 'none')
      .attr('x1', show ? p[0] : 0).attr('y1', show ? p[1] : 0)
      .attr('x2', show ? d.x : 0).attr('y2', show ? d.y : 0);
  });
}

// Pins a specific set of labels visible on the map (hover + current selection).
function showLabels(ids){
  if (!labelSel) return;
  const keep = new Set(ids.filter(Boolean));
  labelSel.classed('label-show', d => keep.has(d.id));
}

function isApprox(id){
  const g = EVENT_GEO[id];
  return !!(g && GEO_PRECISION[g.precision] && GEO_PRECISION[g.precision].approx);
}

/* Switches the simulation between the geographic and force-directed layouts.
   Same nodes, same links, same selection — only the forces change, so the
   nodes visibly travel between the two arrangements. */
function applyLayout(){
  if (!simulation) return;
  const h = svg.node().clientHeight || 500;
  const isMap = layout === 'map';

  document.getElementById('graph-svg').classList.toggle('is-map', isMap);
  document.querySelectorAll('.layout-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.layout === layout));

  if (isMap){
    drawBasemap();
    // Snap straight onto the projected coordinates. The simulation then only
    // relaxes overlaps, so the map is geographically right immediately rather
    // than after the forces settle.
    nodesData.forEach(d => {
      const p = geoXY(d.id);
      if (p){ d.x = p[0]; d.y = p[1]; d.vx = 0; d.vy = 0; }
    });
    simulation
      .force('link', null)
      .force('charge', d3.forceManyBody().strength(-18))
      .force('x', d3.forceX().x(d => { const p = geoXY(d.id); return p ? p[0] : 0; }).strength(0.9))
      .force('y', d3.forceY().y(d => { const p = geoXY(d.id); return p ? p[1] : 0; }).strength(0.9))
      .force('collide', d3.forceCollide().radius(13).strength(0.85));
  } else {
    simulation
      .force('link', d3.forceLink(linksData).id(d => d.id).distance(80).strength(0.35))
      .force('charge', d3.forceManyBody().strength(-170))
      .force('x', d3.forceX().x(d => xForYear(d.year)).strength(0.55))
      .force('y', d3.forceY().y(h/2).strength(0.06))
      .force('collide', d3.forceCollide().radius(22));
  }
  renderPositions();
  simulation.alpha(isMap ? 0.35 : 0.9).restart();
}

function xForYear(year){
  const w = svg.node().clientWidth || 900;
  const frac = (year - 1919) / (1945 - 1919);
  return 50 + frac * (w - 100);
}
function resizeGraph(){
  if (!svg) return;
  applyLayout();
}
function centerOnNode(id){
  const d = nodesData && nodesData.find(n => n.id === id);
  if (!d || !svg) return;
  const w = svg.node().clientWidth, h = svg.node().clientHeight;
  const tf = d3.zoomIdentity.translate(w/2 - (d.x||w/2), h/2 - (d.y||h/2));
  svg.transition().duration(500).call(d3.zoom().transform, tf);
}

function eventVisible(e){
  if (!state.activeTheaters.has(e.theater)) return false;
  if (e.year < state.yearRange[0] || e.year > state.yearRange[1]) return false;
  if (state.search && !e.title.toLowerCase().includes(state.search) && !e.caption.toLowerCase().includes(state.search)) return false;
  return true;
}
function updateVisibility(){
  if (!nodeSel) return;
  const visibleIds = new Set(nodesData.filter(eventVisible).map(d => d.id));
  nodeSel.classed('dim', d => !visibleIds.has(d.id));
  labelSel.classed('node-label-dim', d => !visibleIds.has(d.id));
  linkSel.classed('link-dim', d => !(visibleIds.has(d.source.id) && visibleIds.has(d.target.id)));
}

/* ================= EXPLORE MODE: DETAIL PANEL ================= */
function selectEvent(id){
  state.selected = id;
  if (nodeSel) nodeSel.classed('selected', d => d.id === id);
  if (linkSel) linkSel.classed('link-active', l =>
    id && ((l.source.id || l.source) === id || (l.target.id || l.target) === id));
  showLabels([id]);
  const panel = document.getElementById('detail-panel');
  if (!id){
    panel.innerHTML = `<div class="ex-empty"><span class="stamp">${t('ex.emptyStamp')}</span><p>${t('ex.emptyText')}</p></div>`;
    return;
  }
  const e = eventById[id];
  const th = THEATERS[e.theater];
  const causesOf = linksData.filter(l => (l.target.id||l.target) === id).map(l => ({ev: eventById[l.source.id||l.source], label:l.label}));
  const leadsTo = linksData.filter(l => (l.source.id||l.source) === id).map(l => ({ev: eventById[l.target.id||l.target], label:l.label}));

  let html = `
    <div class="ex-date">${e.date}</div>
    <div class="ex-theater-badge" style="background:${th.hex}22;color:${th.hex};border:1px solid ${th.hex}55">${th.label}</div>
    <h3 class="ex-title">${e.title}</h3>
    ${placeHTML(id)}
    <p class="ex-desc">${e.caption}</p>
    <button class="ex-watch-btn" id="ex-watch-jump">${t('ex.watchThis', {roman: toRoman(e.act)})}</button>
  `;
  if (causesOf.length){
    html += `<div class="ex-rel-block"><h3>${t('ex.followedFrom')}</h3>`;
    causesOf.forEach(r => { html += `<div class="ex-rel-item" data-id="${r.ev.id}"><span class="ex-rel-arrow">←</span><span><span class="ex-rel-title">${r.ev.title}</span><span class="ex-rel-label">${r.label}</span></span></div>`; });
    html += `</div>`;
  }
  if (leadsTo.length){
    html += `<div class="ex-rel-block"><h3>${t('ex.ledTo')}</h3>`;
    leadsTo.forEach(r => { html += `<div class="ex-rel-item" data-id="${r.ev.id}"><span class="ex-rel-arrow">→</span><span><span class="ex-rel-title">${r.ev.title}</span><span class="ex-rel-label">${r.label}</span></span></div>`; });
    html += `</div>`;
  }
  html += sourcesHTML(id);
  panel.innerHTML = html;
  panel.querySelectorAll('.ex-rel-item').forEach(el => { el.onclick = () => { selectEvent(el.dataset.id); centerOnNode(el.dataset.id); }; });
  document.getElementById('ex-watch-jump').onclick = () => { setMode('watch'); setTimeout(() => document.getElementById('watch-'+id).scrollIntoView({behavior:'smooth', block:'center'}), 60); };
}

/* ================= EXPLORE MODE: TIMELINE ================= */
const yMin = 1919, yMax = 1945;
function renderTimeline(){
  const tSvg = d3.select('#timeline-svg');
  tSvg.selectAll('*').remove();
  const tWidth = tSvg.node().clientWidth || 900, tHeight = 40;
  const x = d3.scaleLinear().domain([yMin, yMax]).range([12, tWidth-12]);

  tSvg.append('line').attr('x1',12).attr('x2',tWidth-12).attr('y1',tHeight/2).attr('y2',tHeight/2).attr('stroke','#2A251E').attr('stroke-width',2);
  tSvg.selectAll('.tick').data(events).join('circle').attr('class','tick')
    .attr('cx', d => x(d.year)).attr('cy', tHeight/2).attr('r', 2.5)
    .attr('fill', d => THEATERS[d.theater].hex).attr('opacity', 0.8);

  const brush = d3.brushX().extent([[8,4],[tWidth-8, tHeight-4]]).on('brush end', (event) => {
    if (!event.selection) return;
    const [x0,x1] = event.selection.map(x.invert);
    state.yearRange = [Math.round(x0), Math.round(x1)];
    document.getElementById('range-label').textContent =
      (state.yearRange[0]===yMin && state.yearRange[1]===yMax) ? t('ex.fullTimeline') : t('ex.viewing', {from: state.yearRange[0], to: state.yearRange[1]});
    updateVisibility();
  });
  const brushG = tSvg.append('g').call(brush);
  brushG.call(brush.move, [x(state.yearRange[0]), x(state.yearRange[1])]);
  brushG.selectAll('.selection').attr('fill','#D9A24C').attr('fill-opacity',0.12).attr('stroke','#8C6B33');
  brushG.selectAll('.handle').attr('fill','#D9A24C');
}

window.addEventListener('resize', () => {
  if (document.body.classList.contains('mode-explore')){ resizeGraph(); renderTimeline(); }
});

</script>
</body>
</html>
