events: {
  versailles:{title:'Le traité de Versailles', date:'juin 1919',
    caption:'L’Allemagne signe le traité mettant fin à la Première Guerre mondiale et accepte des réparations, des pertes territoriales et de strictes limites à son armée.',
    detail:'L’article 231 attribuait la responsabilité de la guerre à l’Allemagne et à ses alliés, une clause reçue en Allemagne comme l’exigence d’avouer une culpabilité exclusive. Le traité imposait de lourdes réparations, restituait l’Alsace-Lorraine à la France et plafonnait l’armée allemande à 100 000 hommes, sans aviation, chars ni sous-marins. Il fut négocié principalement par la Grande-Bretagne, la France, les États-Unis et l’Italie, l’Allemagne étant exclue des pourparlers et sommée de signer.'},
  depression:{title:'La Grande Dépression', date:'1929',
    caption:'Un effondrement économique mondial, déclenché par le krach de Wall Street, provoque un chômage de masse et une instabilité politique dans toute l’Europe.',
    detail:'En 1932, le chômage allemand approchait les 6 millions, soit près d’un tiers de la population active. Des banques firent faillite dans toute l’Europe centrale, les économies exportatrices s’effondrèrent et les partis traditionnels perdirent leur crédit faute d’enrayer la chute. La crise frappa avec une force particulière l’Allemagne, qui remboursait encore ses réparations de guerre.'},
  manchuria:{title:'Le Japon envahit la Mandchourie', date:'septembre 1931',
    caption:'L’armée japonaise occupe la Mandchourie, dans le nord-est de la Chine, et y établit l’État fantoche du Mandchoukouo.',
    detail:'L’invasion suivit une explosion mise en scène sur une voie ferrée sous contrôle japonais près de Moukden, utilisée comme prétexte. La Société des Nations condamna l’action ; le Japon répondit en s’en retirant en 1933. Ce fut la première grande conquête territoriale d’une future puissance de l’Axe, huit ans avant le déclenchement de la guerre en Europe.'},
  'hitler-power':{title:'Hitler nommé chancelier', date:'janvier 1933',
    caption:'Adolf Hitler est nommé chancelier d’Allemagne et, en quelques mois, élimine toute opposition politique.',
    detail:'Hitler fut nommé par le président Hindenburg à la tête d’un gouvernement de coalition. L’incendie du Reichstag, en février 1933, servit à justifier des pouvoirs d’exception, et la loi des pleins pouvoirs de mars 1933 lui permit de légiférer sans l’accord du Parlement, mettant de fait fin à la démocratie allemande en moins de deux mois.'},
  rearmament:{title:'Réarmement et Rhénanie', date:'1935–1936',
    caption:'L’Allemagne reconstruit ouvertement son armée et envoie des troupes en Rhénanie démilitarisée, violant Versailles sans conséquence.',
    detail:'La conscription fut rétablie en 1935 et la Luftwaffe dévoilée publiquement, deux mesures interdites par Versailles. En mars 1936, les troupes allemandes entrèrent en Rhénanie, zone maintenue démilitarisée par traité. La France et la Grande-Bretagne, absorbées par leurs affaires intérieures, n’intervinrent pas.'},
  'sino-japanese':{title:'Guerre totale en Chine', date:'juillet 1937',
    caption:'Les combats du pont Marco-Polo, près de Pékin, dégénèrent en guerre ouverte entre le Japon et la Chine.',
    detail:'Ce qui débuta comme une escarmouche entre troupes japonaises et chinoises s’étendit rapidement ; à la fin de 1937, le Japon avait pris Shanghai et Nankin. Le conflit se poursuivit, en grande partie indépendamment des événements européens, jusqu’à se fondre dans la guerre du Pacifique en 1941.'},
  anschluss:{title:'L’Anschluss', date:'mars 1938',
    caption:'L’Allemagne annexe l’Autriche. Aucune puissance étrangère n’intervient militairement.',
    detail:'Les troupes allemandes entrèrent en Autriche le 12 mars 1938, et un plébiscite truqué tenu le mois suivant enregistra un soutien quasi unanime à l’union avec l’Allemagne. L’annexion violait explicitement Versailles. La Grande-Bretagne et la France protestèrent sans agir, renforçant le schéma d’une expansion sans opposition.'},
  munich:{title:'Les accords de Munich', date:'septembre 1938',
    caption:'La Grande-Bretagne, la France, l’Allemagne et l’Italie signent un accord autorisant l’Allemagne à annexer les Sudètes, région de Tchécoslovaquie.',
    detail:'La Tchécoslovaquie ne fut pas partie aux négociations qui décidèrent de ses frontières. Le Premier ministre britannique Neville Chamberlain présenta l’accord comme garantissant « la paix pour notre temps ». Les Sudètes abritaient les principales fortifications frontalières tchécoslovaques, qui passèrent à l’Allemagne avec le territoire.'},
  'czech-occupy':{title:'La Tchécoslovaquie démantelée', date:'mars 1939',
    caption:'Les troupes allemandes occupent le reste de la Tchécoslovaquie, allant au-delà de ce que Munich avait concédé.',
    detail:'Cette opération rompait les termes explicites des accords de Munich, qui n’avaient cédé que les Sudètes. La Grande-Bretagne répondit en garantissant un soutien militaire à la Pologne, largement perçue comme la prochaine sur la liste — un engagement qui serait mis à l’épreuve en moins de six mois.'},
  'molotov-ribbentrop':{title:'Le pacte Molotov-Ribbentrop', date:'août 1939',
    caption:'L’Allemagne et l’Union soviétique signent un pacte de non-agression, assorti d’un protocole secret partageant l’Europe de l’Est en zones d’influence.',
    detail:'Signé par les ministres des Affaires étrangères Viatcheslav Molotov et Joachim von Ribbentrop, le pacte public engageait les deux parties à ne pas s’attaquer pendant dix ans. Un protocole secret, révélé seulement après la guerre, partageait la Pologne, la Finlande, l’Estonie, la Lettonie et la Lituanie en zones allemande et soviétique. Le pacte libérait l’Allemagne du risque de guerre sur deux fronts pour lequel elle s’était préparée.'},

  'poland-invasion':{title:'L’Allemagne envahit la Pologne', date:'1er sept. 1939',

  'declaration-war':{title:'La Grande-Bretagne et la France déclarent la guerre', date:'3 sept. 1939',

  'ussr-poland':{title:'L’Union soviétique entre en Pologne', date:'17 sept. 1939',

  'winter-war':{title:'La guerre d’Hiver', date:'nov. 1939',

  'denmark-norway':{title:'Danemark et Norvège occupés', date:'avr. 1940',

  'low-countries':{title:'La chute des pays du Benelux', date:'mai 1940',

  'france-fall':{title:'La France capitule', date:'juin 1940',

  'battle-britain':{title:'La bataille d’Angleterre', date:'juil.–oct. 1940',

  tripartite:{title:'Le pacte tripartite', date:'27 sept. 1940',

  'italy-greece':{title:'L’Italie envahit la Grèce', date:'28 oct. 1940',

  'yugoslavia-greece':{title:'L’Allemagne occupe la Yougoslavie et la Grèce', date:'avr. 1941',

    caption:'Les forces allemandes atteignent les abords de la capitale soviétique avant d’être arrêtées par la résistance, l’épuisement et un hiver auquel elles n’étaient pas préparées.',
    detail:'Les forces allemandes avancèrent jusqu’à apercevoir Moscou au début de décembre avant d’être arrêtées par une résistance soviétique durcie, l’épuisement, les pénuries de ravitaillement et un hiver rigoureux pour lequel elles n’étaient pas équipées. Une contre-offensive soviétique repoussa les lignes allemandes loin de la capitale.'},

  'oil-embargo':{title:'L’embargo pétrolier américain sur le Japon', date:'août 1941',
    caption:'Après l’occupation japonaise du sud de l’Indochine française, les États-Unis, la Grande-Bretagne et les Pays-Bas gèlent les avoirs japonais et coupent les exportations de pétrole.',
    detail:'Après l’occupation par le Japon du sud de l’Indochine française, les États-Unis, la Grande-Bretagne et les Pays-Bas gelèrent les avoirs japonais et décrétèrent un embargo sur le pétrole, ressource que le Japon importait presque intégralement. Les planificateurs japonais jugèrent intenable la poursuite des opérations en Chine sans s’assurer d’autres sources de pétrole, principalement en Asie du Sud-Est.'},
  'pearl-harbor':{title:'L’attaque de Pearl Harbor', date:'7 déc. 1941',
    caption:'L’aviation embarquée japonaise frappe la flotte américaine du Pacifique à Hawaï, coulant ou endommageant huit cuirassés, mais manquant les porte-avions, partis en mer.',
    detail:'L’aviation japonaise embarquée frappa la flotte américaine du Pacifique au mouillage à Hawaï sans qu’une déclaration de guerre soit parvenue à Washington avant le début de l’attaque. Le raid coula ou endommagea huit cuirassés et fit plus de 2 400 morts, mais manqua les porte-avions de la flotte, alors en mer.'},
  'us-enters':{title:'Les États-Unis déclarent la guerre', date:'8 déc. 1941',
    caption:'Le Congrès approuve la déclaration de guerre au Japon le lendemain de Pearl Harbor, mettant fin à la neutralité américaine.',
    detail:'Le président Roosevelt demanda au Congrès une déclaration de guerre le lendemain de l’attaque, qualifiant le 7 décembre de « date qui restera marquée d’infamie ». La déclaration fut adoptée à une quasi-unanimité, mettant fin à la neutralité américaine dans le conflit.'},
  'axis-declare-us':{title:'L’Allemagne et l’Italie déclarent la guerre aux États-Unis', date:'11 déc. 1941',
    caption:'Au titre du pacte tripartite, l’Allemagne et l’Italie déclarent la guerre aux États-Unis, fondant les guerres européenne et pacifique en un seul conflit.',
    detail:'L’Allemagne et l’Italie déclarèrent la guerre aux États-Unis quatre jours après Pearl Harbor, au titre de leurs obligations du pacte tripartite, bien que les termes de celui-ci ne s’appliquassent techniquement qu’aux situations défensives. Ces déclarations fondirent formellement les conflits européen et pacifique en une seule guerre mondiale.'},
  'japan-expansion':{title:'Le Japon déferle sur l’Asie du Sud-Est', date:'déc. 1941–mai 1942',
    caption:'En six mois après Pearl Harbor, le Japon prend les Philippines, la Malaisie, Singapour, Hong Kong, la Birmanie et les Indes néerlandaises.',
    detail:'En six mois après Pearl Harbor, le Japon s’empara des Philippines, de la Malaisie britannique et de Singapour, de Hong Kong, de la Birmanie et des Indes néerlandaises, s’assurant le pétrole, le caoutchouc et les autres ressources que l’embargo lui avait refusés. Cette conquête rapide laissa le Japon maître d’un vaste périmètre défensif à travers le Pacifique et l’Asie du Sud-Est.'},

  midway:{title:'La bataille de Midway', date:'juin 1942',
    caption:'Les décrypteurs américains anticipent une attaque japonaise sur Midway ; quatre porte-avions d’escadre japonais sont coulés, perte dont l’aéronavale japonaise ne se relèvera pas.',
    detail:'Les décrypteurs américains avaient partiellement percé les communications navales japonaises, permettant à la flotte du Pacifique d’anticiper une attaque sur l’atoll de Midway et de placer ses porte-avions en embuscade. Quatre porte-avions d’escadre japonais furent coulés contre un américain — une perte dont l’aéronavale japonaise ne se remit jamais vraiment.'},
  'el-alamein':{title:'La bataille d’El-Alamein', date:'oct.–nov. 1942',
    caption:'Les forces du Commonwealth britannique stoppent l’avance germano-italienne vers Suez, puis repoussent l’Axe à travers la Libye.',
    detail:'Les forces du Commonwealth britannique commandées par le général Montgomery stoppèrent à El-Alamein l’avance germano-italienne vers le canal de Suez, puis lancèrent une contre-offensive qui refoula l’Axe à travers la Libye dans les mois suivants.'},
  torch:{title:'Opération Torch', date:'nov. 1942',
    caption:'Les forces américaines et britanniques débarquent en Afrique du Nord française, prenant l’Axe en tenaille entre deux fronts.',
    detail:'Les forces américaines et britanniques débarquèrent en plusieurs points de la côte d’Afrique du Nord française, alors sous contrôle de Vichy. Après une brève résistance, les forces françaises sur place rallièrent les Alliés et, jointes à l’avance britannique venue d’Égypte, prirent l’Axe en tenaille.'},
  stalingrad:{title:'La bataille de Stalingrad', date:'août 1942–févr. 1943',
    caption:'Des mois de combats de rue s’achèvent par l’encerclement et la capitulation de la VIe armée allemande — l’une des plus lourdes pertes militaires allemandes de la guerre.',
    detail:'Les forces allemandes combattirent rue par rue pour prendre la ville, immobilisant la VIe armée durant l’automne 1942. Une contre-offensive soviétique en novembre encercla environ 250 000 hommes de l’Axe ; les survivants capitulèrent en février 1943.'},
  guadalcanal:{title:'La bataille de Guadalcanal', date:'août 1942–févr. 1943',
    caption:'Six mois de combats pour un seul aérodrome s’achèvent par le retrait japonais — la première offensive terrestre alliée soutenue contre le Japon.',
    detail:'Les Marines américains débarquèrent à Guadalcanal pour s’emparer d’un aérodrome que le Japon y construisait, ouvrant six mois de combats terrestres, navals et aériens intenses pour l’île. Le retrait japonais marqua la première offensive terrestre alliée soutenue de la guerre du Pacifique. (La première défaite terrestre infligée aux forces japonaises était survenue quelques semaines plus tôt à Milne Bay, en Nouvelle-Guinée, où des troupes australiennes repoussèrent un débarquement en août-septembre 1942.)'},
  'axis-africa-surrender':{title:'L’Axe capitule en Afrique', date:'mai 1943',
    caption:'Prises en tenaille entre deux armées alliées, les troupes allemandes et italiennes restantes en Tunisie capitulent, mettant fin à la campagne d’Afrique.',
    detail:'Prises en tenaille entre les forces britanniques venues d’Égypte et les forces anglo-américaines venues de l’ouest, les troupes allemandes et italiennes restantes en Tunisie capitulèrent, mettant fin à la présence de l’Axe en Afrique et livrant quelque 250 000 prisonniers.'},
  sicily:{title:'Débarquement allié en Sicile', date:'juil. 1943',
    caption:'Les Alliés s’assurent la Sicile en six semaines lors de la plus vaste opération amphibie à ce jour ; le gouvernement de Mussolini tombe deux semaines après le débarquement.',
    detail:'Les forces alliées débarquèrent en Sicile les 9 et 10 juillet lors de la plus vaste opération amphibie de la guerre à ce moment-là, et s’assurèrent l’île en six semaines. L’invasion fit tomber Mussolini en une quinzaine de jours : le Grand Conseil du fascisme vota contre lui et le roi le destitua et le fit arrêter le 25 juillet.'},
  kursk:{title:'La bataille de Koursk', date:'juil. 1943',
    caption:'L’offensive blindée massive allemande, anticipée par le renseignement soviétique, se solde par une défaite qui remet définitivement l’initiative à l’URSS.',
    detail:'L’Allemagne tenta de réduire un saillant soviétique près de Koursk par une offensive blindée massive, anticipée par le renseignement soviétique, qui avait préparé des lignes défensives en profondeur. La bataille, engageant des milliers de chars, s’acheva par une victoire soviétique qui déplaça durablement l’initiative stratégique sur le front de l’Est.'},
  'italy-surrender':{title:'L’Italie capitule', date:'sept. 1943',
    caption:'Le nouveau gouvernement italien conclut secrètement un armistice avec les Alliés ; l’Allemagne réagit en occupant rapidement la péninsule.',
    detail:'Après la destitution de Mussolini, le nouveau gouvernement italien négocia secrètement un armistice avec les Alliés. Les forces allemandes, qui s’y attendaient, occupèrent rapidement la majeure partie de la péninsule et y poursuivirent les combats aux côtés des fascistes restés fidèles.'},
  'island-hopping':{title:'Le « saut d’île en île » commence', date:'1943–44',
    caption:'Plutôt que d’assaillir chaque île tenue par le Japon, les forces américaines en prennent certaines et en contournent d’autres, isolant les places fortes de tout ravitaillement.',
    detail:'Plutôt que d’assaillir chaque île tenue par le Japon, les forces américaines prenaient sélectivement celles qui étaient stratégiquement utiles et contournaient les plus fortifiées, les coupant de tout ravitaillement et renfort. Cette stratégie permit de progresser plus vite vers le Japon tout en réduisant les pertes devant les points forts contournés.'},

  dday:{title:'Le Jour J : le débarquement de Normandie', date:'6 juin 1944',
    caption:'Les Alliés débarquent sur cinq plages de Normandie après une campagne de déception ayant convaincu le commandement allemand que l’assaut principal viendrait par Calais.',
    detail:'Les forces alliées débarquèrent sur cinq secteurs de plage de la côte normande, appuyées par des largages aéroportés et par une campagne de déception qui avait convaincu le commandement allemand que l’invasion principale viendrait plus au nord, par le Pas-de-Calais. L’établissement d’une tête de pont solide ouvrit un second front durable en Europe occidentale.'},
  bagration:{title:'Opération Bagration', date:'juin 1944',
    caption:'Coordonnée avec le débarquement de Normandie, une immense offensive soviétique détruit une grande partie du groupe d’armées Centre allemand en Biélorussie.',
    detail:'Conçue pour coïncider avec le débarquement de Normandie, l’offensive soviétique en Biélorussie détruisit une part considérable du groupe d’armées Centre allemand, infligeant des pertes comparables ou supérieures à celles de Stalingrad et refoulant les forces allemandes vers la Pologne.'},
  'paris-liberated':{title:'Paris est libérée', date:'août 1944',
    caption:'Une insurrection de la Résistance coïncide avec l’arrivée des troupes alliées ; la garnison allemande capitule au lieu de détruire la ville comme ordonné.',
    detail:'Tandis que les forces alliées progressaient depuis la Normandie, une insurrection de la Résistance française à Paris coïncida avec l’arrivée des troupes de la France libre et américaines, et le commandant allemand livra la ville plutôt que d’exécuter l’ordre de destruction de Hitler — même si l’on discute de la capacité de destruction dont disposait encore réellement la garnison.'},
  'leyte-gulf':{title:'La bataille du golfe de Leyte', date:'oct. 1944',
    caption:'La plus grande bataille navale de la guerre laisse la marine japonaise incapable de monter une autre opération majeure, et voit les premières attaques kamikazes organisées.',
    detail:'Lors de la plus grande bataille navale de la guerre, le Japon engagea presque toute sa flotte restante pour tenter de détruire les forces américaines appuyant l’invasion des Philippines. La bataille comprit les premières attaques kamikazes organisées et laissa la marine japonaise incapable de monter une autre opération majeure jusqu’à la fin de la guerre.'},
  bulge:{title:'La bataille des Ardennes', date:'déc. 1944–janv. 1945',
    caption:'La dernière grande offensive allemande à l’ouest vise à couper les lignes alliées ; une résistance croissante et l’éclaircie du temps l’épuisent en six semaines.',
    detail:'L’Allemagne massa ses forces pour une offensive surprise à travers la forêt des Ardennes, afin de couper les lignes alliées et de reprendre le port d’Anvers. Les gains initiaux créèrent une poche visible dans les lignes alliées, mais une résistance croissante, les renforts et l’éclaircie du temps, qui permit l’appui aérien allié, épuisèrent l’offensive en six semaines.'},

  yalta:{title:'La conférence de Yalta', date:'févr. 1945',
    caption:'Roosevelt, Churchill et Staline se réunissent pour organiser l’Allemagne d’après-guerre, les frontières de la Pologne et l’entrée soviétique en guerre contre le Japon.',
    detail:'La défaite allemande devenant de plus en plus certaine, Roosevelt, Churchill et Staline se réunirent en Crimée pour discuter du partage de l’Allemagne d’après-guerre, des frontières de la Pologne, de la structure des Nations unies et de l’entrée soviétique en guerre contre le Japon dans les trois mois suivant la capitulation allemande.'},
  'iwo-jima':{title:'La bataille d’Iwo Jima', date:'févr.–mars 1945',
    caption:'Les Marines américains prennent l’île fortifiée, précieuse pour ses aérodromes, face à une garnison japonaise retranchée dans un vaste réseau de tunnels.',
    detail:'Les Marines américains débarquèrent sur la petite île volcanique, précieuse pour des aérodromes situés à portée de chasseurs du Japon, face à une garnison japonaise retranchée dans un vaste réseau de tunnels. La quasi-totalité de la garnison japonaise fut tuée, et les pertes américaines furent elles aussi très lourdes au regard de la taille de l’île.'},
  okinawa:{title:'La bataille d’Okinawa', date:'avr.–juin 1945',
    caption:'La plus vaste campagne amphibie américaine du Pacifique connaît des attaques kamikazes soutenues et de lourdes pertes de tous côtés pendant près de trois mois.',
    detail:'L’invasion d’Okinawa, conçue comme base pour une éventuelle invasion des îles japonaises, subit des attaques kamikazes soutenues contre la flotte et fit de nombreuses victimes parmi les combattants japonais et alliés comme parmi les civils okinawaïens — un bilan qui nourrit ensuite les estimations du coût d’une invasion directe du Japon.'},
  'berlin-fall':{title:'La chute de Berlin', date:'avr.–mai 1945',
    caption:'Les forces soviétiques encerclent Berlin et progressent pâté de maisons par pâté de maisons ; Hitler se donne la mort et la garnison capitule quelques jours plus tard.',
    detail:'Les forces soviétiques encerclèrent Berlin fin avril 1945 et progressèrent dans la ville pâté de maisons par pâté de maisons. Les troupes soviétiques à quelques rues de son bunker et sans perspective de secours, Hitler se donna la mort le 30 avril ; la garnison de la ville capitula quelques jours plus tard.'},
  've-day':{title:'Victoire en Europe : l’Allemagne capitule', date:'7–8 mai 1945',
    caption:'Les chefs militaires allemands signent les actes de capitulation sans condition, mettant formellement fin à la guerre en Europe tandis que celle du Pacifique continue.',
    detail:'Après la mort de Hitler et la chute de Berlin, les chefs militaires allemands signèrent les actes de capitulation sans condition, mettant formellement fin à la guerre en Europe. Des célébrations éclatèrent dans les pays alliés, même si la guerre contre le Japon se poursuivait.'},
  hiroshima:{title:'Le bombardement atomique d’Hiroshima', date:'6 août 1945',
    caption:'Les États-Unis larguent sur Hiroshima la première arme atomique employée en temps de guerre, détruisant la majeure partie de la ville.',
    detail:'Les États-Unis larguèrent une bombe atomique sur Hiroshima, ville d’environ 350 000 habitants, détruisant la majeure partie de la ville et tuant, d’après les estimations, entre 70 000 et 140 000 personnes avant la fin de l’année, du fait de l’explosion et de ses suites. Ce fut le premier emploi d’une arme nucléaire en temps de guerre.'},
  'ussr-japan':{title:'L’Union soviétique déclare la guerre au Japon', date:'8 août 1945',
    caption:'Honorant son engagement de Yalta, l’URSS envahit la Mandchourie occupée par le Japon, supprimant toute perspective de paix négociée par Moscou.',
    detail:'Honorant son engagement de Yalta, l’Union soviétique déclara la guerre au Japon et lança une vaste offensive en Mandchourie occupée, submergeant rapidement les forces japonaises et supprimant toute perspective de paix négociée par l’intermédiaire de Moscou, que certains dirigeants japonais recherchaient.'},
  nagasaki:{title:'Le bombardement atomique de Nagasaki', date:'9 août 1945',
    caption:'Trois jours après Hiroshima, une seconde bombe atomique est larguée sur Nagasaki alors que les dirigeants japonais délibèrent sur la capitulation.',
    detail:'Trois jours après Hiroshima, les États-Unis larguèrent une seconde bombe atomique sur Nagasaki, tuant, d’après les estimations, entre 40 000 et 80 000 personnes avant la fin de l’année. Les dirigeants japonais, qui envisageaient déjà la capitulation, délibérèrent les jours suivants.'},
  'japan-surrender':{title:'Le Japon annonce sa capitulation', date:'15 août 1945',
    caption:'L’empereur Hirohito annonce à la radio l’acceptation des conditions de capitulation — la première fois que la plupart des citoyens entendaient sa voix.',
    detail:'L’empereur Hirohito annonça l’acceptation par le Japon des conditions alliées de capitulation dans une allocution radiodiffusée au peuple japonais, la première fois que la plupart des citoyens entendaient sa voix. Les combats cessèrent en grande partie, même si l’acte formel de capitulation restait à signer.'},
  'vj-day':{title:'Capitulation formelle du Japon', date:'2 sept. 1945',
    caption:'Les représentants japonais signent l’acte de capitulation à bord de l’USS Missouri, dans la baie de Tokyo, mettant formellement fin à la Seconde Guerre mondiale.',
    detail:'Les représentants japonais signèrent l’acte de capitulation à bord de l’USS Missouri, dans la baie de Tokyo, mettant formellement fin à la Seconde Guerre mondiale — un conflit qui, selon la plupart des estimations, fit entre 70 et 85 millions de morts dans le monde.'},
},

    note:'Le chômage allemand culmina à près de 6 millions au début de 1932, soit environ 30 % de la population active. Une version antérieure de ce projet indiquait « environ un quart », ce qui est sous-évalué.'}],

  anschluss:[{claim:'un plébiscite truqué tenu le mois suivant',

    caption:'Die deutsche Luftwaffe greift britische Flugplätze und Städte an, um eine Invasion vorzubereiten; die britische Verteidigung hält, die Invasion wird verschoben.',
    detail:'Nach dem Fall Frankreichs begann die deutsche Luftwaffe eine anhaltende Kampagne gegen britische Flugplätze, Infrastruktur und später Städte, um die für eine Landung über den Kanal nötige Luftüberlegenheit zu erringen. Die Royal Air Force, gestützt auf radargeführte Abwehr, fügte Verluste zu, die Deutschland veranlassten, seine Invasionspläne auf unbestimmte Zeit zu verschieben.'},
  'italy-africa':{title:'Italien eröffnet die nordafrikanische Front', date:'Sep. 1940',
    caption:'Italienische Truppen rücken von Libyen ins britisch gehaltene Ägypten vor und zielen auf den Suezkanal, bis eine britische Gegenoffensive sie zurückwirft.',
    detail:'Im September 1940 rückten italienische Truppen von Libyen ins britisch gehaltene Ägypten vor, um den Suezkanal zu bedrohen. Der Vormarsch geriet ins Stocken, und eine im Dezember begonnene britische Gegenoffensive warf die Italiener tief nach Libyen zurück — woraufhin Deutschland im Folgejahr Verstärkung entsandte.'},
  tripartite:{title:'Der Dreimächtepakt', date:'27. Sep. 1940',
    caption:'Deutschland, Italien und Japan formalisieren ein Dreierbündnis und verpflichten sich, einander beizustehen, falls eine neue Macht einen von ihnen angreift.',
    detail:'Deutschland, Italien und Japan formalisierten ein gegenseitiges Verteidigungsbündnis und verpflichteten sich, einander beizustehen, falls einer von ihnen von einer Macht angegriffen würde, die noch nicht am europäischen oder am japanisch-chinesischen Konflikt beteiligt war — eine Klausel, die vor allem die Vereinigten Staaten vom Kriegseintritt abhalten sollte.'},
  'italy-greece':{title:'Italien überfällt Griechenland', date:'28. Okt. 1940',
    caption:'Italien greift Griechenland von Albanien aus an, ohne sich mit Deutschland abzustimmen; griechische Truppen stoppen den Vormarsch und dringen nach Albanien vor.',
    detail:'Italien begann von dem von ihm kontrollierten Albanien aus eine Invasion Griechenlands, ohne vorherige Abstimmung mit Deutschland — Hitler erfuhr davon erst, als sie bereits lief. Die griechischen Kräfte stoppten den Vormarsch und drängten die italienischen Truppen nach Albanien zurück, ein unerwarteter Rückschlag, der Monate später deutsche Kräfte auf den Balkan ziehen sollte.'},
  'yugoslavia-greece':{title:'Deutschland besetzt Jugoslawien und Griechenland', date:'Apr. 1941',
    caption:'Deutschland überfällt beide Länder binnen Wochen und rettet Italiens festgefahrenen Griechenlandfeldzug, wenige Wochen bevor die Invasion der Sowjetunion beginnt.',
    detail:'Nach einem Putsch in Jugoslawien, der eine mit der Achse verbündete Regierung stürzte, und um Italiens festgefahrenen Feldzug in Griechenland zu retten, überfiel Deutschland im April 1941 beide Länder. Beide waren binnen weniger Wochen besetzt. Barbarossa begann anschließend etwa fünf Wochen später als ursprünglich geplant — wie viel davon tatsächlich auf den Balkan zurückgeht, ist jedoch umstritten; angeführt werden auch eine ungewöhnlich späte Schneeschmelze und unfertige Logistik.'},
  barbarossa:{title:'Unternehmen Barbarossa', date:'22. Juni 1941',
    caption:'Deutschland bricht seinen Pakt mit der Sowjetunion und beginnt die größte Landinvasion der Geschichte, an einer Front von der Ostsee bis zum Schwarzen Meer.',
    detail:'Deutschland begann die größte Landinvasion der Geschichte und setzte über drei Millionen Soldaten ein. Die anfänglichen Vorstöße waren rasch und kesselten große sowjetische Verbände ein, doch der Zeitplan des Feldzugs — die UdSSR vor dem Winter zu besiegen — wurde nicht eingehalten.'},
  'moscow-battle':{title:'Die Schlacht um Moskau', date:'Okt. 1941–Jan. 1942',
    caption:'Deutsche Truppen erreichen die Außenbezirke der sowjetischen Hauptstadt, bevor Widerstand, Erschöpfung und ein Winter, auf den sie nicht vorbereitet sind, sie zum Stehen bringen.',
    detail:'Anfang Dezember waren deutsche Truppen bis in Sichtweite Moskaus vorgedrungen, bevor sie durch erstarkenden sowjetischen Widerstand, Erschöpfung, Nachschubmangel und strengen Winter, für den sie nicht ausgerüstet waren, zum Stehen kamen. Eine sowjetische Gegenoffensive drängte die deutschen Linien von der Hauptstadt zurück.'},

  'oil-embargo':{title:'Das US-Ölembargo gegen Japan', date:'Aug. 1941',
    caption:'Nach der japanischen Besetzung Südindochinas frieren die USA, Großbritannien und die Niederlande japanische Guthaben ein und stoppen die Ölausfuhr.',
    detail:'Nachdem Japan den Süden Französisch-Indochinas besetzt hatte, froren die Vereinigten Staaten, Großbritannien und die Niederlande japanische Guthaben ein und verhängten ein Ölembargo — bei einem Rohstoff, den Japan fast vollständig einführte. Japans Planer hielten die Fortführung der Operationen in China ohne alternative Ölquellen, vor allem in Südostasien, für nicht durchhaltbar.'},
  'pearl-harbor':{title:'Der Angriff auf Pearl Harbor', date:'7. Dez. 1941',
    caption:'Japanische Trägerflugzeuge treffen die US-Pazifikflotte auf Hawaii, versenken oder beschädigen acht Schlachtschiffe, verfehlen aber die Flugzeugträger, die auf See sind.',
    detail:'Japanische trägergestützte Flugzeuge griffen die in Hawaii vor Anker liegende US-Pazifikflotte an, ohne dass vor Angriffsbeginn eine Kriegserklärung in Washington eingetroffen wäre. Der Angriff versenkte oder beschädigte acht Schlachtschiffe und tötete über 2.400 Menschen, verfehlte aber die Flugzeugträger der Flotte, die sich auf See befanden.'},
  'us-enters':{title:'Die Vereinigten Staaten erklären den Krieg', date:'8. Dez. 1941',
    caption:'Der Kongress billigt am Tag nach Pearl Harbor die Kriegserklärung an Japan und beendet damit die bisherige amerikanische Neutralität.',
    detail:'Präsident Roosevelt ersuchte den Kongress am Tag nach dem Angriff um eine Kriegserklärung und nannte den 7. Dezember „einen Tag, der in Schande fortleben wird“. Die Erklärung wurde nahezu einstimmig angenommen und beendete die bisherige amerikanische Neutralität in diesem Konflikt.'},
  'axis-declare-us':{title:'Deutschland und Italien erklären den USA den Krieg', date:'11. Dez. 1941',
    caption:'Unter Berufung auf den Dreimächtepakt erklären Deutschland und Italien den Vereinigten Staaten den Krieg und verschmelzen den europäischen und den pazifischen Krieg zu einem.',
    detail:'Deutschland und Italien erklärten den Vereinigten Staaten vier Tage nach Pearl Harbor den Krieg, unter Berufung auf ihre Verpflichtungen aus dem Dreimächtepakt, obwohl dessen Bestimmungen streng genommen nur für Verteidigungsfälle galten. Die Erklärungen verschmolzen den europäischen und den pazifischen Konflikt förmlich zu einem einzigen Weltkrieg.'},
  'japan-expansion':{title:'Japan überrollt Südostasien', date:'Dez. 1941–Mai 1942',
    caption:'Binnen sechs Monaten nach Pearl Harbor nimmt Japan die Philippinen, Malaya, Singapur, Hongkong, Birma und Niederländisch-Indien ein.',
    detail:'Binnen sechs Monaten nach Pearl Harbor eroberte Japan die Philippinen, Britisch-Malaya und Singapur, Hongkong, Birma und Niederländisch-Indien und sicherte sich damit das Öl, den Kautschuk und die übrigen Rohstoffe, die ihm das Embargo verwehrt hatte. Die rasche Eroberung ließ Japan einen weiten Verteidigungsgürtel über den Pazifik und Südostasien beherrschen.'},

  midway:{title:'Die Schlacht um Midway', date:'Juni 1942',
    caption:'US-Codeknacker sagen einen japanischen Angriff auf Midway voraus; vier japanische Flottenträger werden versenkt — ein Verlust, von dem sich Japans Marineluftwaffe nie erholt.',
    detail:'Amerikanische Codeknacker hatten den japanischen Marinefunk teilweise entschlüsselt, sodass die Pazifikflotte einen japanischen Angriff auf das Midway-Atoll vorhersehen und ihre Träger zum Hinterhalt in Stellung bringen konnte. Vier japanische Flottenträger wurden versenkt, gegen einen amerikanischen — ein Verlust, von dem sich Japans Marineluftwaffe nie ganz erholte.'},
  'el-alamein':{title:'Die Schlacht von El Alamein', date:'Okt.–Nov. 1942',
    caption:'Britische Commonwealth-Truppen stoppen den deutsch-italienischen Vormarsch auf Suez und drängen die Achse dann quer durch Libyen zurück.',
    detail:'Britische Commonwealth-Truppen unter General Montgomery stoppten bei El Alamein den deutsch-italienischen Vormarsch auf den Suezkanal und begannen dann eine Gegenoffensive, die die Achsenkräfte in den folgenden Monaten quer durch Libyen zurückdrängte.'},
  torch:{title:'Unternehmen Torch', date:'Nov. 1942',
    caption:'Amerikanische und britische Truppen landen in Französisch-Nordafrika und nehmen die Achse zwischen zwei vorrückenden Fronten in die Zange.',
    detail:'Amerikanische und britische Truppen landeten an mehreren Punkten der Küste Französisch-Nordafrikas, das damals unter Vichy-Kontrolle stand. Nach kurzem Widerstand schlossen sich die dortigen französischen Kräfte den Alliierten an und nahmen zusammen mit dem britischen Vormarsch aus Ägypten die Achse von zwei Seiten in die Zange.'},
  stalingrad:{title:'Die Schlacht von Stalingrad', date:'Aug. 1942–Feb. 1943',
    caption:'Monate des Straßenkampfs enden mit der Einkesselung und Kapitulation der 6. Armee — einer der größten militärischen Verluste Deutschlands im Krieg.',
    detail:'Deutsche Truppen kämpften Straße um Straße um die Stadt und banden die 6. Armee den Herbst 1942 hindurch. Eine sowjetische Gegenoffensive im November kesselte rund 250.000 Achsensoldaten ein; die verbliebenen Verbände kapitulierten im Februar 1943.'},
  guadalcanal:{title:'Die Schlacht um Guadalcanal', date:'Aug. 1942–Feb. 1943',
    caption:'Sechs Monate Kampf um einen einzigen Flugplatz enden mit Japans Rückzug — die erste anhaltende alliierte Bodenoffensive gegen Japan.',
    detail:'US-Marines landeten auf Guadalcanal, um einen dort von Japan angelegten Flugplatz zu nehmen; es folgten sechs Monate erbitterter Land-, See- und Luftkämpfe um die Insel. Japans schließlicher Rückzug markierte die erste anhaltende alliierte Bodenoffensive des Pazifikkriegs. (Die erste den japanischen Streitkräften zugefügte Niederlage zu Lande war Wochen zuvor in der Milne-Bucht auf Neuguinea erfolgt, wo australische Truppen im August und September 1942 eine Landung abwehrten.)'},
  'axis-africa-surrender':{title:'Die Achse kapituliert in Afrika', date:'Mai 1943',
    caption:'Zwischen zwei vorrückenden alliierten Armeen eingeschlossen, kapitulieren die verbliebenen deutschen und italienischen Truppen in Tunesien; der Afrikafeldzug endet.',
    detail:'Zwischen den aus Ägypten vorrückenden britischen und den von Westen kommenden angloamerikanischen Kräften eingeschlossen, kapitulierten die verbliebenen deutschen und italienischen Truppen in Tunesien. Damit endete die Präsenz der Achse in Afrika; rund 250.000 Gefangene fielen den Alliierten zu.'},
  sicily:{title:'Alliierte Landung auf Sizilien', date:'Juli 1943',
    caption:'Die Alliierten sichern Sizilien in sechs Wochen in der bis dahin größten amphibischen Operation; Mussolinis Regierung stürzt zwei Wochen nach der Landung.',
    detail:'Am 9. und 10. Juli landeten alliierte Truppen auf Sizilien in der bis dahin größten amphibischen Operation des Krieges und sicherten die Insel binnen sechs Wochen. Die Invasion brachte Mussolini in etwa zwei Wochen zu Fall: Der Große Faschistische Rat stimmte gegen ihn, und der König entließ und verhaftete ihn am 25. Juli.'},
  kursk:{title:'Die Schlacht bei Kursk', date:'Juli 1943',
    caption:'Deutschlands massierte Panzeroffensive, von der sowjetischen Aufklärung vorhergesehen, endet in einer Niederlage — die Initiative geht endgültig an die UdSSR.',
    detail:'Deutschland versuchte, einen sowjetischen Frontbogen bei Kursk mit einer massierten Panzeroffensive zu beseitigen; die sowjetische Aufklärung hatte sie vorhergesehen und tiefgestaffelte Verteidigungslinien angelegt. Die Schlacht, an der Tausende Panzer beteiligt waren, endete mit einem sowjetischen Sieg, der die strategische Initiative an der Ostfront dauerhaft verschob.'},
  'italy-surrender':{title:'Italien kapituliert', date:'Sep. 1943',
    caption:'Die neue italienische Regierung schließt heimlich einen Waffenstillstand mit den Alliierten; Deutschland reagiert mit der raschen Besetzung der Halbinsel.',
    detail:'Nach Mussolinis Absetzung verhandelte die neue italienische Regierung heimlich einen Waffenstillstand mit den Alliierten. Die deutschen Kräfte, die damit gerechnet hatten, besetzten rasch den größten Teil der italienischen Halbinsel und kämpften dort an der Seite der verbliebenen faschistischen Loyalisten weiter.'},
  'island-hopping':{title:'Das „Inselspringen“ beginnt', date:'1943–44',
    caption:'Statt jede japanisch gehaltene Insel zu stürmen, nehmen die US-Streitkräfte ausgewählte Inseln und umgehen Stützpunkte, die dadurch vom Nachschub abgeschnitten werden.',
    detail:'Statt jede von Japan gehaltene Insel zu stürmen, nahmen die US-Streitkräfte gezielt strategisch nützliche Inseln und umgingen die stark befestigten, die so von Nachschub und Verstärkung abgeschnitten wurden. Die Strategie erlaubte ein rascheres Vorgehen auf Japan zu und verringerte die Verluste vor den umgangenen Stützpunkten.'},

  dday:{title:'D-Day: die Landung in der Normandie', date:'6. Juni 1944',
    caption:'Die Alliierten landen an fünf Stränden der Normandie, nachdem eine Täuschungskampagne die deutsche Führung überzeugt hat, die Hauptinvasion komme bei Calais.',
    detail:'Alliierte Truppen landeten in fünf Strandabschnitten an der normannischen Küste, unterstützt von Luftlandungen und von einer Täuschungskampagne, die die deutsche Führung überzeugt hatte, die Hauptinvasion werde weiter nördlich bei Calais erfolgen. Die Sicherung eines Brückenkopfs eröffnete eine dauerhafte zweite Front in Westeuropa.'},
  bagration:{title:'Operation Bagration', date:'Juni 1944',
    caption:'Zeitlich auf die Landung in der Normandie abgestimmt, zerschlägt eine gewaltige sowjetische Offensive große Teile der deutschen Heeresgruppe Mitte in Weißrussland.',
    detail:'Zeitlich auf die Landung in der Normandie abgestimmt, zerschlug die sowjetische Offensive in Weißrussland einen erheblichen Teil der deutschen Heeresgruppe Mitte, fügte Verluste zu, die denen von Stalingrad gleichkamen oder sie überstiegen, und drängte die deutschen Kräfte nach Polen zurück.'},
  'paris-liberated':{title:'Paris wird befreit', date:'Aug. 1944',
    caption:'Ein Aufstand der Résistance fällt mit dem Eintreffen alliierter Truppen zusammen; die deutsche Garnison kapituliert, statt die Stadt wie befohlen zu zerstören.',
    detail:'Während die alliierten Kräfte aus der Normandie vorrückten, fiel ein Aufstand der französischen Résistance in Paris mit dem Eintreffen freifranzösischer und amerikanischer Truppen zusammen, und der deutsche Kommandant übergab die Stadt, statt Hitlers Zerstörungsbefehl auszuführen — wobei umstritten ist, über wie viel Zerstörungskraft die Garnison tatsächlich noch verfügte.'},
  'leyte-gulf':{title:'Die Schlacht im Golf von Leyte', date:'Okt. 1944',
    caption:'Die größte Seeschlacht des Krieges lässt Japans Marine unfähig zu einer weiteren großen Operation zurück und sieht die ersten organisierten Kamikaze-Angriffe.',
    detail:'In der größten Seeschlacht des Krieges setzte Japan nahezu seine gesamte verbliebene Flotte ein, um die amerikanischen Kräfte zu vernichten, die die Invasion der Philippinen deckten. Zur Schlacht gehörten die ersten organisierten Kamikaze-Angriffe; sie ließ die japanische Marine für den Rest des Krieges unfähig zu einer weiteren großen Operation zurück.'},
  bulge:{title:'Die Ardennenoffensive', date:'Dez. 1944–Jan. 1945',
    caption:'Deutschlands letzte große Offensive im Westen soll die alliierten Linien spalten; erstarkender Widerstand und aufklarendes Wetter zermürben sie binnen sechs Wochen.',
    detail:'Deutschland zog Kräfte für eine Überraschungsoffensive durch die Ardennen zusammen, um die alliierten Linien zu spalten und den Hafen von Antwerpen zurückzugewinnen. Die anfänglichen Geländegewinne schufen eine sichtbare Ausbuchtung in den alliierten Linien, doch erstarkender Widerstand, Verstärkungen und aufklarendes Wetter, das alliierte Luftunterstützung ermöglichte, zermürbten die Offensive binnen sechs Wochen.'},

  yalta:{title:'Die Konferenz von Jalta', date:'Feb. 1945',
    caption:'Roosevelt, Churchill und Stalin treffen sich, um das Nachkriegsdeutschland, Polens Grenzen und den sowjetischen Kriegseintritt gegen Japan zu planen.',
    detail:'Da die deutsche Niederlage zunehmend feststand, trafen sich Roosevelt, Churchill und Stalin auf der Krim, um über die Nachkriegsaufteilung Deutschlands, die Grenzen Polens, den Aufbau der Vereinten Nationen und den sowjetischen Kriegseintritt gegen Japan binnen dreier Monate nach der deutschen Kapitulation zu beraten.'},
  'iwo-jima':{title:'Die Schlacht um Iwojima', date:'Feb.–März 1945',
    caption:'US-Marines nehmen die befestigte, wegen ihrer Flugplätze wertvolle Insel gegen eine in einem weitläufigen Tunnelsystem eingegrabene japanische Garnison.',
    detail:'US-Marines landeten auf der kleinen Vulkaninsel, die wegen ihrer Flugplätze in Jagdflugzeugreichweite Japans wertvoll war, gegen eine in einem weitläufigen Tunnelsystem eingegrabene japanische Garnison. Nahezu die gesamte japanische Besatzung fiel, und auch die amerikanischen Verluste waren gemessen an der Größe der Insel schwer.'},
  okinawa:{title:'Die Schlacht um Okinawa', date:'Apr.–Juni 1945',
    caption:'Die größte amphibische Operation der USA im Pazifikkrieg bringt anhaltende Kamikaze-Angriffe und über fast drei Monate schwere Verluste auf allen Seiten.',
    detail:'Die Invasion Okinawas, gedacht als Ausgangsbasis für eine spätere Invasion der japanischen Hauptinseln, erlebte anhaltende Kamikaze-Angriffe auf die Landungsflotte und forderte hohe Verluste unter japanischen wie alliierten Kämpfern und ebenso unter der Zivilbevölkerung Okinawas — Zahlen, die später die Schätzungen über die Kosten einer direkten Invasion Japans prägten.'},
  'berlin-fall':{title:'Der Fall Berlins', date:'Apr.–Mai 1945',
    caption:'Sowjetische Truppen schließen Berlin ein und kämpfen sich Block für Block vor; Hitler nimmt sich das Leben, die Garnison kapituliert wenige Tage später.',
    detail:'Ende April 1945 schlossen sowjetische Truppen Berlin ein und kämpften sich Block für Block durch die Stadt. Mit sowjetischen Truppen wenige Straßen von seinem Bunker entfernt und ohne Aussicht auf Entsatz nahm sich Hitler am 30. April das Leben; die Garnison der Stadt kapitulierte wenige Tage später.'},
  've-day':{title:'Tag des Sieges in Europa — Deutschland kapituliert', date:'7.–8. Mai 1945',
    caption:'Deutsche Befehlshaber unterzeichnen die bedingungslose Kapitulation und beenden damit förmlich den Krieg in Europa, während der Pazifikkrieg weitergeht.',
    detail:'Nach Hitlers Tod und dem Fall Berlins unterzeichneten deutsche Befehlshaber die Urkunden der bedingungslosen Kapitulation und beendeten damit förmlich den Krieg in Europa. In den alliierten Ländern brachen Feiern aus, doch der Krieg gegen Japan ging weiter.'},
  hiroshima:{title:'Der Atombombenabwurf auf Hiroshima', date:'6. Aug. 1945',
    caption:'Die Vereinigten Staaten werfen die erste im Krieg eingesetzte Atomwaffe auf Hiroshima ab und zerstören den größten Teil der Stadt.',
    detail:'Die Vereinigten Staaten warfen eine Atombombe auf Hiroshima ab, eine Stadt mit rund 350.000 Einwohnern, zerstörten den größten Teil der Stadt und töteten nach Schätzungen bis zum Jahresende 70.000 bis 140.000 Menschen durch die Explosion und ihre Folgen. Es war der erste Einsatz einer Kernwaffe in einem Krieg.'},
  'ussr-japan':{title:'Die Sowjetunion erklärt Japan den Krieg', date:'8. Aug. 1945',
    caption:'Ihrer Zusage von Jalta folgend, überfällt die UdSSR die von Japan besetzte Mandschurei und nimmt jede Aussicht auf einen von Moskau vermittelten Frieden.',
    detail:'Ihrer in Jalta gegebenen Zusage folgend, erklärte die Sowjetunion Japan den Krieg und begann eine große Offensive in die von Japan besetzte Mandschurei, überrannte die dortigen japanischen Kräfte rasch und nahm jede Aussicht auf einen über Moskau vermittelten Verhandlungsfrieden, den einige japanische Politiker verfolgt hatten.'},
  nagasaki:{title:'Der Atombombenabwurf auf Nagasaki', date:'9. Aug. 1945',
    caption:'Drei Tage nach Hiroshima wird eine zweite Atombombe auf Nagasaki abgeworfen, während die japanische Führung über die Kapitulation berät.',
    detail:'Drei Tage nach Hiroshima warfen die Vereinigten Staaten eine zweite Atombombe auf Nagasaki ab, die nach Schätzungen bis zum Jahresende 40.000 bis 80.000 Menschen tötete. Die japanische Führung, die eine Kapitulation bereits erwog, beriet in den folgenden Tagen.'},
  'japan-surrender':{title:'Japan verkündet die Kapitulation', date:'15. Aug. 1945',
    caption:'Kaiser Hirohito verkündet in einer Rundfunkansprache die Annahme der Kapitulationsbedingungen — das erste Mal, dass die meisten Bürger seine Stimme hörten.',
    detail:'Kaiser Hirohito verkündete in einer Rundfunkansprache an das japanische Volk die Annahme der alliierten Kapitulationsbedingungen — das erste Mal, dass die meisten Bürger seine Stimme hörten. Die Kampfhandlungen endeten weitgehend, doch die förmliche Kapitulationsurkunde stand noch aus.'},
  'vj-day':{title:'Förmliche Kapitulation Japans', date:'2. Sep. 1945',
    caption:'Japanische Vertreter unterzeichnen die Kapitulationsurkunde an Bord der USS Missouri in der Bucht von Tokio und beenden damit förmlich den Zweiten Weltkrieg.',
    detail:'Japanische Vertreter unterzeichneten die Kapitulationsurkunde an Bord der USS Missouri in der Bucht von Tokio und beendeten damit förmlich den Zweiten Weltkrieg — einen Konflikt, der nach den meisten Schätzungen weltweit zwischen 70 und 85 Millionen Menschen das Leben kostete.'},
},

  versailles:{title:'Hoà ước Versailles', date:'Tháng 6/1919',
    caption:'Đức ký hoà ước kết thúc Thế chiến thứ nhất, chấp nhận bồi thường, mất lãnh thổ và những giới hạn ngặt nghèo đối với quân đội.',
    detail:'Điều 231 quy trách nhiệm gây chiến cho Đức và các đồng minh của Đức — một điều khoản mà người Đức đọc như một đòi hỏi phải thú nhận tội lỗi của riêng mình. Hoà ước buộc Đức bồi thường những khoản lớn, trả Alsace-Lorraine cho Pháp, và giới hạn lục quân Đức ở mức 100.000 người, không được có không quân, xe tăng hay tàu ngầm. Hoà ước chủ yếu do Anh, Pháp, Hoa Kỳ và Ý đàm phán; Đức bị loại khỏi các cuộc thương lượng và chỉ được đưa cho các điều khoản để ký.'},
  depression:{title:'Đại khủng hoảng', date:'1929',
    caption:'Một cuộc sụp đổ kinh tế toàn cầu, khởi phát từ vụ sụp đổ Phố Wall, gây thất nghiệp hàng loạt và bất ổn chính trị khắp châu Âu.',
    detail:'Đến năm 1932, số người thất nghiệp ở Đức đã gần chạm sáu triệu — khoảng một phần ba lực lượng lao động. Ngân hàng phá sản khắp Trung Âu, các nền kinh tế xuất khẩu sụp đổ, và các đảng phái chính thống mất uy tín vì không chặn được đà suy sụp. Cuộc khủng hoảng giáng đòn đặc biệt nặng nề xuống nước Đức, khi đó vẫn còn đang trả các khoản bồi thường chiến tranh.'},
  manchuria:{title:'Nhật Bản xâm chiếm Mãn Châu', date:'Tháng 9/1931',
    caption:'Quân đội Nhật chiếm Mãn Châu ở đông bắc Trung Quốc và lập ra nhà nước bù nhìn Mãn Châu Quốc.',
    detail:'Cuộc xâm chiếm diễn ra sau một vụ nổ được dàn dựng trên tuyến đường sắt do Nhật kiểm soát gần Phụng Thiên, và vụ nổ này được dùng làm cớ. Hội Quốc Liên lên án hành động đó; Nhật đáp lại bằng cách rút khỏi Hội Quốc Liên năm 1933. Đây là cuộc chinh phục lãnh thổ lớn đầu tiên của một cường quốc sau này thuộc phe Trục, tám năm trước khi chiến tranh nổ ra ở châu Âu.'},
  'hitler-power':{title:'Hitler được bổ nhiệm làm Thủ tướng', date:'Tháng 1/1933',
    caption:'Adolf Hitler được bổ nhiệm làm Thủ tướng Đức, và chỉ trong vài tháng đã ra tay loại bỏ mọi lực lượng đối lập chính trị.',
    detail:'Hitler được Tổng thống Hindenburg bổ nhiệm đứng đầu một chính phủ liên hiệp. Vụ cháy nhà Quốc hội tháng 2/1933 được dùng để biện minh cho các quyền lực khẩn cấp, và Đạo luật Trao quyền tháng 3/1933 cho phép Hitler ban hành luật mà không cần Quốc hội thông qua, trên thực tế chấm dứt nền dân chủ Đức chỉ trong chưa đầy hai tháng.'},
  rearmament:{title:'Tái vũ trang và vùng Rhineland', date:'1935–1936',
    caption:'Đức công khai xây dựng lại quân đội và đưa quân vào vùng Rhineland phi quân sự hoá, vi phạm Hoà ước Versailles mà không hề bị trừng phạt.',
    detail:'Chế độ quân dịch được khôi phục năm 1935 và không quân Luftwaffe được công khai ra mắt — cả hai đều bị Hoà ước Versailles cấm. Tháng 3/1936, quân Đức tiến vào Rhineland, vùng được hiệp ước duy trì ở trạng thái phi quân sự hoá. Pháp và Anh, khi ấy đang bận rộn với các vấn đề trong nước, đã không can thiệp.'},
  'sino-japanese':{title:'Chiến tranh toàn diện ở Trung Quốc', date:'Tháng 7/1937',
    caption:'Giao tranh tại cầu Lư Câu gần Bắc Kinh leo thang thành cuộc chiến toàn diện giữa Nhật Bản và Trung Quốc.',
    detail:'Khởi đầu chỉ là một cuộc đụng độ nhỏ giữa quân Nhật và quân Trung Quốc, nhưng nhanh chóng lan rộng; đến cuối năm 1937 Nhật đã chiếm Thượng Hải và Nam Kinh. Cuộc xung đột này tiếp diễn phần lớn độc lập với các biến cố ở châu Âu, cho tới khi hoà vào cuộc Chiến tranh Thái Bình Dương rộng lớn hơn năm 1941.'},
  anschluss:{title:'Sáp nhập nước Áo', date:'Tháng 3/1938',
    caption:'Đức sáp nhập Áo. Không một cường quốc nước ngoài nào can thiệp bằng quân sự.',
    detail:'Quân Đức vượt biên giới vào Áo ngày 12/3/1938, và một cuộc trưng cầu dân ý bị dàn xếp tổ chức vào tháng sau đó ghi nhận sự ủng hộ gần như tuyệt đối cho việc hợp nhất với Đức. Việc sáp nhập vi phạm Hoà ước Versailles một cách rõ ràng. Anh và Pháp phản đối nhưng không hành động, càng củng cố mô thức bành trướng không gặp cản trở.'},
  munich:{title:'Hiệp ước München', date:'Tháng 9/1938',
    caption:'Anh, Pháp, Đức và Ý ký một hiệp ước cho phép Đức sáp nhập vùng Sudetenland của Tiệp Khắc.',
    detail:'Chính Tiệp Khắc lại không được tham gia các cuộc thương lượng định đoạt biên giới của mình. Thủ tướng Anh Neville Chamberlain mô tả thoả thuận này là bảo đảm “hoà bình cho thời đại chúng ta”. Vùng Sudetenland chứa các công sự biên giới chủ yếu của Tiệp Khắc, và chúng được chuyển giao cho Đức cùng với lãnh thổ.'},
  'czech-occupy':{title:'Tiệp Khắc bị chia cắt', date:'Tháng 3/1939',
    caption:'Quân Đức chiếm nốt phần còn lại của Tiệp Khắc, vượt xa những gì Hiệp ước München đã nhượng bộ.',
    detail:'Hành động này vi phạm các điều khoản minh thị của Hiệp ước München, vốn chỉ nhượng vùng Sudetenland. Anh đáp lại bằng cách đưa ra bảo đảm hỗ trợ quân sự cho Ba Lan, nước được nhiều người cho là mục tiêu kế tiếp — một cam kết sẽ bị thử thách chỉ trong vòng sáu tháng.'},
  'molotov-ribbentrop':{title:'Hiệp ước Molotov–Ribbentrop', date:'Tháng 8/1939',
    caption:'Đức và Liên Xô ký hiệp ước không xâm lược, kèm một nghị định thư bí mật chia Đông Âu thành các vùng ảnh hưởng.',
    detail:'Do hai ngoại trưởng Vyacheslav Molotov và Joachim von Ribbentrop ký, phần công khai của hiệp ước ràng buộc hai bên không tấn công nhau trong mười năm. Một nghị định thư bí mật, mãi sau chiến tranh mới được công bố, đã chia Ba Lan, Phần Lan, Estonia, Latvia và Litva thành vùng của Đức và vùng của Liên Xô. Hiệp ước giải thoát cho Đức khỏi nguy cơ chiến tranh hai mặt trận mà họ vẫn phải tính đến.'},

  'poland-invasion':{title:'Đức xâm lược Ba Lan', date:'1/9/1939',
    caption:'Quân Đức vượt biên giới Ba Lan, kết hợp không quân và thiết giáp trong một cuộc tấn công thần tốc sau này được gọi là “blitzkrieg”.',
    detail:'Quân Đức vượt biên giới Ba Lan vào những giờ đầu ngày 1/9, bằng các đợt tấn công phối hợp giữa không quân và thiết giáp. Trái với một lời đồn dai dẳng, không quân Ba Lan không hề bị tiêu diệt dưới mặt đất: lực lượng này đã phân tán tới các sân bay dự bị được nguỵ trang từ trước cuộc xâm lược và tiếp tục chiến đấu thêm khoảng hai tuần. Sức kháng cự có tổ chức của Ba Lan kéo dài chừng năm tuần, đơn vị lớn cuối cùng đầu hàng ngày 6/10.'},
  'declaration-war':{title:'Anh và Pháp tuyên chiến', date:'3/9/1939',
    caption:'Sau khi tối hậu thư gửi Đức hết hạn mà không có hồi đáp, Anh và Pháp tuyên chiến, chính thức mở màn cuộc chiến ở châu Âu.',
    detail:'Anh gửi tối hậu thư đòi Đức rút khỏi Ba Lan; khi thời hạn trôi qua mà không có hồi đáp, Anh tuyên chiến, và Pháp làm theo vài giờ sau đó. Không nước nào trong hai nước ở vào thế có thể cứu viện quân sự ngay lập tức cho Ba Lan.'},
  'ussr-poland':{title:'Liên Xô tiến vào Ba Lan', date:'17/9/1939',
    caption:'Quân Liên Xô tiến vào miền đông Ba Lan theo nghị định thư bí mật của hiệp ước, mở mặt trận thứ hai chống lại một nhà nước Ba Lan vốn đã đang sụp đổ.',
    detail:'Quân Liên Xô tiến vào miền đông Ba Lan ngày 17/9, hành động theo nghị định thư bí mật của Hiệp ước Molotov–Ribbentrop. Quân Ba Lan, vốn đã giao tranh với Đức ở phía tây, phải đối mặt với mặt trận thứ hai mà gần như không còn khả năng ứng phó. Đến đầu tháng 10, Ba Lan bị Đức và Liên Xô chia đôi.'},
  'winter-war':{title:'Chiến tranh Mùa đông', date:'Tháng 11/1939',
    caption:'Liên Xô tấn công Phần Lan sau khi nước này bác bỏ các yêu sách lãnh thổ; sức kháng cự quyết liệt của Phần Lan giữa mùa đông khắc nghiệt gây tổn thất nặng cho quân Liên Xô.',
    detail:'Liên Xô tấn công Phần Lan sau khi nước này bác bỏ yêu cầu nhượng lãnh thổ gần Leningrad. Quân Phần Lan tổ chức phòng thủ hiệu quả đến bất ngờ trong điều kiện mùa đông khắc nghiệt, cho tới khi hoà ước tháng 3/1940 cắt khoảng 10% lãnh thổ Phần Lan cho Liên Xô.'},
  'denmark-norway':{title:'Đan Mạch và Na Uy bị chiếm đóng', date:'Tháng 4/1940',
    caption:'Đức mở các chiến dịch đồng thời nhằm vào Đan Mạch, nước đầu hàng chỉ sau vài giờ, và Na Uy, nơi cầm cự được hai tháng.',
    detail:'Đức mở các chiến dịch đồng thời nhằm vào Đan Mạch, nước đầu hàng chỉ sau vài giờ, và Na Uy, nơi giao tranh kéo dài khoảng hai tháng với sự hỗ trợ của Anh và Pháp trước khi thất thủ. Chiến dịch này bảo đảm cho Đức lối tiếp cận các cảng Na Uy và tuyến vận chuyển quặng sắt từ Thuỵ Điển.'},
  'low-countries':{title:'Các nước vùng Đất Thấp thất thủ', date:'Tháng 5/1940',
    caption:'Đức tấn công Hà Lan, Bỉ và Luxembourg, vòng qua tuyến biên giới kiên cố của Pháp bằng cách tiến qua rừng Ardennes.',
    detail:'Quân Đức tấn công Hà Lan, Bỉ và Luxembourg ngày 10/5, vòng qua Phòng tuyến Maginot kiên cố của Pháp bằng cách tiến qua rừng Ardennes, nơi vẫn được cho là xe tăng không thể vượt qua. Hà Lan đầu hàng sau năm ngày; Bỉ cầm cự tới ngày 28/5.'},
  'france-fall':{title:'Pháp đầu hàng', date:'Tháng 6/1940',
    caption:'Các sư đoàn thiết giáp Đức chia cắt lực lượng Đồng Minh và tiến ra tới eo biển Manche; Pháp ký hiệp định đình chiến sáu tuần sau khi cuộc xâm lược bắt đầu.',
    detail:'Các sư đoàn thiết giáp Đức chọc thủng phòng tuyến Pháp và ra tới eo biển Manche chỉ trong hai tuần, chia cắt lực lượng Đồng Minh. Pháp ký hiệp định đình chiến ngày 22/6; hai phần ba phía bắc đặt dưới sự chiếm đóng của Đức, trong khi một chính phủ Pháp mới đặt tại Vichy quản lý miền nam.'},
  'battle-britain':{title:'Trận chiến nước Anh', date:'Tháng 7–10/1940',
    caption:'Không quân Đức oanh tạc các sân bay và thành phố Anh để dọn đường cho một cuộc đổ bộ; hệ thống phòng thủ Anh trụ vững, và cuộc đổ bộ bị hoãn lại.',
    detail:'Sau khi Pháp thất thủ, không quân Đức mở chiến dịch oanh tạc liên tục nhằm vào các sân bay, hạ tầng và về sau là các thành phố của Anh, nhằm giành ưu thế trên không cần thiết cho một cuộc đổ bộ vượt eo biển. Không quân Hoàng gia Anh, với sự hỗ trợ của hệ thống phòng không dẫn đường bằng radar, đã gây tổn thất đủ lớn khiến Đức phải hoãn vô thời hạn kế hoạch đổ bộ.'},
  'italy-africa':{title:'Ý mở mặt trận Bắc Phi', date:'Tháng 9/1940',
    caption:'Quân Ý tiến từ Libya vào Ai Cập do Anh kiểm soát, nhắm tới kênh đào Suez, trước khi bị một đợt phản công của Anh đẩy lùi.',
    detail:'Tháng 9/1940, quân Ý tiến từ Libya vào Ai Cập do Anh kiểm soát, nhằm uy hiếp kênh đào Suez. Đà tiến bị khựng lại, và một đợt phản công của Anh mở màn tháng 12 đã đẩy quân Ý lùi sâu vào Libya, khiến Đức phải gửi quân tiếp viện sang vào năm sau.'},
  tripartite:{title:'Hiệp ước Tam cường', date:'27/9/1940',
    caption:'Đức, Ý và Nhật chính thức lập liên minh quân sự ba bên, mỗi bên cam kết hỗ trợ các bên còn lại nếu bị một cường quốc mới tấn công.',
    detail:'Đức, Ý và Nhật chính thức lập một liên minh phòng thủ chung, mỗi bên cam kết hỗ trợ các bên còn lại nếu bị tấn công bởi một cường quốc chưa tham gia cuộc chiến ở châu Âu hay cuộc chiến Trung–Nhật — một điều khoản chủ yếu nhằm răn đe Hoa Kỳ khỏi việc tham chiến ở bất kỳ mặt trận nào.'},
  'italy-greece':{title:'Ý xâm lược Hy Lạp', date:'28/10/1940',
    caption:'Ý tấn công Hy Lạp từ Albania mà không phối hợp với Đức; quân Hy Lạp chặn được đà tiến và đánh ngược vào lãnh thổ Albania.',
    detail:'Ý mở cuộc xâm lược Hy Lạp từ Albania do họ kiểm soát mà không hề bàn trước với Đức — Hitler chỉ biết khi chiến dịch đã bắt đầu. Quân Hy Lạp chặn được đà tiến và đẩy quân Ý lùi trở lại lãnh thổ Albania, một thất bại bất ngờ mà vài tháng sau sẽ kéo quân Đức vào vùng Balkan.'},
  'yugoslavia-greece':{title:'Đức chiếm Nam Tư và Hy Lạp', date:'Tháng 4/1941',
    caption:'Đức xâm chiếm cả hai nước chỉ trong vài tuần, giải vây cho chiến dịch Hy Lạp đang sa lầy của Ý, ít tuần trước khi cuộc xâm lược Liên Xô bắt đầu.',
    detail:'Sau một cuộc đảo chính ở Nam Tư lật đổ chính phủ đã ngả theo phe Trục, và nhằm giải vây cho chiến dịch sa lầy của Ý ở Hy Lạp, Đức xâm chiếm cả hai nước vào tháng 4/1941. Cả hai đều bị chiếm đóng chỉ trong vài tuần. Chiến dịch Barbarossa sau đó khởi động muộn hơn khoảng năm tuần so với kế hoạch ban đầu — song bao nhiêu phần trong sự chậm trễ ấy thực sự do vùng Balkan gây ra thì vẫn còn tranh cãi; nhiều ý kiến còn dẫn ra một mùa tuyết tan muộn bất thường và hậu cần chưa sẵn sàng.'},
  barbarossa:{title:'Chiến dịch Barbarossa', date:'22/6/1941',
    caption:'Đức xé bỏ hiệp ước với Liên Xô, mở cuộc xâm lược trên bộ lớn nhất lịch sử, trên một mặt trận trải từ biển Baltic tới Hắc Hải.',
    detail:'Đức mở cuộc xâm lược trên bộ lớn nhất lịch sử, huy động hơn ba triệu quân. Các đợt tiến công ban đầu diễn ra nhanh chóng và bao vây được nhiều lực lượng lớn của Liên Xô, nhưng tiến độ của chiến dịch — vốn được tính toán để đánh bại Liên Xô trước mùa đông — đã không đạt được.'},
  'moscow-battle':{title:'Trận Moskva', date:'Tháng 10/1941–1/1942',
    caption:'Quân Đức tiến tới vùng ngoại vi thủ đô Liên Xô trước khi bị chặn lại bởi sức kháng cự, sự kiệt sức và một mùa đông họ không hề chuẩn bị.',
    detail:'Đầu tháng 12, quân Đức đã tiến tới tầm nhìn thấy Moskva trước khi bị chặn lại bởi sức kháng cự ngày càng cứng rắn của Liên Xô, sự kiệt sức, tình trạng thiếu tiếp tế, và mùa đông khắc nghiệt mà quân Đức không được trang bị để chịu đựng. Một đợt phản công của Liên Xô đã đẩy phòng tuyến Đức lùi xa khỏi thủ đô.'},

  'oil-embargo':{title:'Hoa Kỳ cấm vận dầu mỏ với Nhật Bản', date:'Tháng 8/1941',
    caption:'Sau khi Nhật chiếm miền nam Đông Dương thuộc Pháp, Hoa Kỳ, Anh và Hà Lan phong toả tài sản Nhật và cắt xuất khẩu dầu.',
    detail:'Sau khi Nhật chiếm miền nam Đông Dương thuộc Pháp, Hoa Kỳ, Anh và Hà Lan phong toả tài sản của Nhật và cấm vận xuất khẩu dầu — thứ tài nguyên mà Nhật gần như phải nhập khẩu hoàn toàn. Giới hoạch định Nhật cho rằng không thể duy trì các chiến dịch ở Trung Quốc nếu không giành được nguồn dầu thay thế, chủ yếu ở Đông Nam Á.'},
  'pearl-harbor':{title:'Trận Trân Châu Cảng', date:'7/12/1941',
    caption:'Máy bay từ tàu sân bay Nhật tập kích Hạm đội Thái Bình Dương của Hoa Kỳ tại Hawaii, đánh chìm hoặc làm hư hại tám thiết giáp hạm, nhưng bỏ lỡ các tàu sân bay đang ở ngoài khơi.',
    detail:'Máy bay xuất phát từ tàu sân bay Nhật tập kích Hạm đội Thái Bình Dương của Hoa Kỳ đang neo đậu ở Hawaii, trong khi tuyên chiến chưa kịp tới Washington trước lúc trận đánh bắt đầu. Cuộc tập kích đánh chìm hoặc làm hư hại tám thiết giáp hạm và khiến hơn 2.400 người thiệt mạng, nhưng bỏ lỡ các tàu sân bay của hạm đội khi ấy đang ở ngoài khơi.'},
  'us-enters':{title:'Hoa Kỳ tuyên chiến', date:'8/12/1941',
    caption:'Quốc hội thông qua tuyên chiến với Nhật Bản ngay hôm sau trận Trân Châu Cảng, chấm dứt thế trung lập trước đó của Hoa Kỳ.',
    detail:'Tổng thống Roosevelt đề nghị Quốc hội tuyên chiến ngay hôm sau cuộc tập kích, gọi ngày 7/12 là “một ngày sẽ mãi sống trong ô nhục”. Tuyên chiến được thông qua với sự ủng hộ gần như tuyệt đối, chấm dứt thế trung lập trước đó của Hoa Kỳ trong cuộc xung đột.'},
  'axis-declare-us':{title:'Đức và Ý tuyên chiến với Hoa Kỳ', date:'11/12/1941',
    caption:'Thực hiện Hiệp ước Tam cường, Đức và Ý tuyên chiến với Hoa Kỳ, hợp nhất cuộc chiến châu Âu và Thái Bình Dương thành một.',
    detail:'Đức và Ý tuyên chiến với Hoa Kỳ bốn ngày sau trận Trân Châu Cảng, thực hiện nghĩa vụ theo Hiệp ước Tam cường, dù xét về câu chữ thì các điều khoản của hiệp ước chỉ áp dụng cho tình huống phòng thủ. Các tuyên chiến này chính thức hợp nhất cuộc xung đột ở châu Âu và ở Thái Bình Dương thành một cuộc chiến toàn cầu duy nhất.'},
  'japan-expansion':{title:'Nhật Bản càn quét Đông Nam Á', date:'Tháng 12/1941–5/1942',
    caption:'Trong sáu tháng sau trận Trân Châu Cảng, Nhật chiếm Philippines, Malaya, Singapore, Hồng Kông, Miến Điện và Đông Ấn thuộc Hà Lan.',
    detail:'Trong sáu tháng sau trận Trân Châu Cảng, Nhật chiếm Philippines, Malaya thuộc Anh và Singapore, Hồng Kông, Miến Điện và Đông Ấn thuộc Hà Lan, giành được dầu mỏ, cao su và các tài nguyên khác mà lệnh cấm vận trước đó đã chặn lại. Cuộc chinh phục chớp nhoáng này khiến Nhật kiểm soát một vành đai phòng thủ rộng lớn trải khắp Thái Bình Dương và Đông Nam Á.'},

  midway:{title:'Trận Midway', date:'Tháng 6/1942',
    caption:'Các chuyên gia giải mã Hoa Kỳ đoán trước đòn tấn công của Nhật vào Midway; bốn tàu sân bay chủ lực Nhật bị đánh chìm, tổn thất mà không lực hải quân Nhật không bao giờ hồi phục.',
    detail:'Các chuyên gia giải mã Hoa Kỳ đã phá được một phần liên lạc của hải quân Nhật, giúp Hạm đội Thái Bình Dương đoán trước đòn tấn công vào đảo san hô Midway và bố trí tàu sân bay của mình vào thế mai phục. Bốn tàu sân bay chủ lực Nhật bị đánh chìm, đổi lại một tàu của Mỹ — tổn thất mà không lực hải quân Nhật không bao giờ hồi phục hoàn toàn.'},
  'el-alamein':{title:'Trận El Alamein', date:'Tháng 10–11/1942',
    caption:'Lực lượng Khối Thịnh vượng chung Anh chặn đà tiến của quân Đức–Ý về phía Suez, rồi đẩy phe Trục lùi qua Libya.',
    detail:'Lực lượng Khối Thịnh vượng chung Anh dưới quyền tướng Montgomery chặn đà tiến của quân Đức–Ý về phía kênh đào Suez tại El Alamein, rồi mở đợt phản công đẩy lực lượng phe Trục lùi qua Libya trong những tháng sau đó.'},
  torch:{title:'Chiến dịch Torch', date:'Tháng 11/1942',
    caption:'Quân Mỹ và Anh đổ bộ lên Bắc Phi thuộc Pháp, ép phe Trục vào giữa hai mặt trận đang siết lại.',
    detail:'Quân Mỹ và Anh đổ bộ tại nhiều điểm dọc bờ biển Bắc Phi thuộc Pháp, khi ấy nằm dưới quyền kiểm soát của chính quyền Vichy. Sau một thời gian kháng cự ngắn, lực lượng Pháp tại đó gia nhập phe Đồng Minh và, cùng với đà tiến của quân Anh từ Ai Cập, siết phe Trục từ hai hướng.'},
  stalingrad:{title:'Trận Stalingrad', date:'Tháng 8/1942–2/1943',
    caption:'Nhiều tháng giao tranh trong từng con phố kết thúc bằng việc Tập đoàn quân số 6 của Đức bị bao vây và buộc phải đầu hàng — một trong những tổn thất quân sự lớn nhất của Đức trong cuộc chiến.',
    detail:'Quân Đức giành giật từng con phố để chiếm thành phố, khiến Tập đoàn quân số 6 bị cầm chân suốt mùa thu 1942. Đợt phản công của Liên Xô hồi tháng 11 đã bao vây khoảng 250.000 quân phe Trục; lực lượng còn lại đầu hàng vào tháng 2/1943.'},
  guadalcanal:{title:'Trận Guadalcanal', date:'Tháng 8/1942–2/1943',
    caption:'Sáu tháng giao tranh giành một sân bay duy nhất kết thúc bằng việc Nhật rút lui — cuộc tấn công trên bộ liên tục đầu tiên của Đồng Minh nhằm vào Nhật Bản.',
    detail:'Thuỷ quân lục chiến Mỹ đổ bộ lên Guadalcanal để chiếm một sân bay mà Nhật đang xây dựng ở đó, mở đầu sáu tháng giao tranh dữ dội trên bộ, trên biển và trên không giành hòn đảo. Việc Nhật rút lui đánh dấu cuộc tấn công trên bộ liên tục đầu tiên của Đồng Minh trong Chiến tranh Thái Bình Dương. (Thất bại trên bộ đầu tiên mà quân Nhật phải nhận thực ra đã diễn ra vài tuần trước đó tại vịnh Milne ở New Guinea, nơi quân Úc đẩy lui một cuộc đổ bộ vào tháng 8 và 9/1942.)'},
  'axis-africa-surrender':{title:'Phe Trục đầu hàng ở châu Phi', date:'Tháng 5/1943',
    caption:'Bị kẹp giữa hai đạo quân Đồng Minh đang tiến lên, số quân Đức và Ý còn lại ở Tunisia đầu hàng, khép lại chiến dịch châu Phi.',
    detail:'Bị kẹp giữa quân Anh tiến từ Ai Cập và quân Anh–Mỹ tiến từ phía tây, số quân Đức và Ý còn lại ở Tunisia đã đầu hàng, chấm dứt sự hiện diện của phe Trục ở châu Phi và giao nộp khoảng 250.000 tù binh.'},
  sicily:{title:'Đồng Minh đổ bộ lên Sicilia', date:'Tháng 7/1943',
    caption:'Đồng Minh kiểm soát Sicilia trong sáu tuần bằng chiến dịch đổ bộ lớn nhất tính đến thời điểm đó; chính quyền Mussolini sụp đổ hai tuần sau khi đổ bộ.',
    detail:'Quân Đồng Minh đổ bộ lên Sicilia ngày 9 và 10/7 trong chiến dịch đổ bộ lớn nhất của cuộc chiến tính đến thời điểm đó, và kiểm soát hòn đảo trong sáu tuần. Cuộc đổ bộ khiến Mussolini đổ chỉ sau khoảng hai tuần: Đại hội đồng Phát xít bỏ phiếu chống lại ông, và nhà vua cách chức rồi bắt giữ ông ngày 25/7.'},
  kursk:{title:'Trận Kursk', date:'Tháng 7/1943',
    caption:'Đòn tấn công thiết giáp quy mô lớn của Đức, đã bị tình báo Liên Xô đoán trước, kết thúc bằng thất bại — trao vĩnh viễn thế chủ động cho Liên Xô.',
    detail:'Đức tìm cách xoá bỏ chỗ lồi của Liên Xô gần Kursk bằng một đòn tấn công thiết giáp quy mô lớn, nhưng tình báo Liên Xô đã đoán trước và chuẩn bị sẵn các tuyến phòng ngự có chiều sâu. Trận đánh, với hàng nghìn xe tăng tham chiến, kết thúc bằng chiến thắng của Liên Xô và làm dịch chuyển vĩnh viễn thế chủ động chiến lược trên Mặt trận phía Đông.'},
  'italy-surrender':{title:'Ý đầu hàng', date:'Tháng 9/1943',
    caption:'Chính phủ Ý mới bí mật ký hiệp định đình chiến với Đồng Minh; Đức đáp lại bằng cách nhanh chóng chiếm đóng bán đảo.',
    detail:'Sau khi Mussolini bị phế truất, chính phủ Ý mới bí mật thương lượng hiệp định đình chiến với Đồng Minh. Quân Đức, vốn đã lường trước, nhanh chóng chiếm phần lớn bán đảo Ý và tiếp tục chiến đấu tại đó cùng với những người phát xít còn trung thành.'},
  'island-hopping':{title:'Chiến thuật “nhảy đảo” bắt đầu', date:'1943–44',
    caption:'Thay vì đánh chiếm từng hòn đảo do Nhật giữ, quân Mỹ chọn lọc chiếm một số đảo và bỏ qua các cứ điểm khác, cắt đứt đường tiếp tế của chúng.',
    detail:'Thay vì tấn công mọi hòn đảo do Nhật chiếm giữ, quân Mỹ chọn lọc chiếm những đảo có giá trị chiến lược và bỏ qua những nơi được phòng thủ kiên cố, cắt đứt đường tiếp tế và tiếp viện của chúng. Chiến thuật này cho phép tiến nhanh hơn về phía Nhật Bản, đồng thời giảm thương vong trước các cứ điểm bị bỏ qua.'},

  dday:{title:'Ngày D: cuộc đổ bộ Normandie', date:'6/6/1944',
    caption:'Đồng Minh đổ bộ lên năm bãi biển Normandie sau một chiến dịch nghi binh khiến bộ chỉ huy Đức tin rằng đòn chính sẽ diễn ra ở Calais.',
    detail:'Quân Đồng Minh đổ bộ lên năm khu vực bãi biển dọc bờ Normandie, với sự yểm trợ của lực lượng đổ bộ đường không và một chiến dịch nghi binh đã khiến bộ chỉ huy Đức tin rằng cuộc đổ bộ chính sẽ diễn ra xa hơn về phía bắc, tại Calais. Việc thiết lập được đầu cầu vững chắc đã mở ra một mặt trận thứ hai lâu dài ở Tây Âu.'},
  bagration:{title:'Chiến dịch Bagration', date:'Tháng 6/1944',
    caption:'Được phối hợp với cuộc đổ bộ Normandie, một chiến dịch tấn công quy mô lớn của Liên Xô đã tiêu diệt phần lớn Cụm tập đoàn quân Trung tâm của Đức ở Belarus.',
    detail:'Được tính toán để trùng với cuộc đổ bộ Normandie, chiến dịch tấn công của Liên Xô ở Belarus đã tiêu diệt một phần đáng kể Cụm tập đoàn quân Trung tâm của Đức, gây tổn thất ngang bằng hoặc vượt cả Stalingrad, và đẩy quân Đức lùi về phía Ba Lan.'},
  'paris-liberated':{title:'Paris được giải phóng', date:'Tháng 8/1944',
    caption:'Cuộc nổi dậy của lực lượng kháng chiến trùng với thời điểm quân Đồng Minh tiến vào; đơn vị đồn trú Đức đầu hàng thay vì phá huỷ thành phố theo lệnh.',
    detail:'Khi quân Đồng Minh tiến lên từ Normandie, cuộc nổi dậy của lực lượng kháng chiến Pháp ở Paris trùng với thời điểm quân Pháp Tự do và quân Mỹ tiến vào, và viên chỉ huy Đức đã giao lại thành phố thay vì thi hành lệnh phá huỷ của Hitler — dù vẫn còn tranh cãi về việc đơn vị đồn trú khi đó thực sự còn bao nhiêu khả năng phá huỷ.'},
  'leyte-gulf':{title:'Trận vịnh Leyte', date:'Tháng 10/1944',
    caption:'Trận hải chiến lớn nhất của cuộc chiến khiến hải quân Nhật không còn khả năng mở thêm một chiến dịch lớn nào, và chứng kiến những đợt tấn công kamikaze có tổ chức đầu tiên.',
    detail:'Trong trận hải chiến lớn nhất của cuộc chiến, Nhật huy động gần như toàn bộ hạm đội còn lại nhằm tiêu diệt lực lượng Mỹ đang yểm trợ cuộc đổ bộ lên Philippines. Trận đánh có những đợt tấn công kamikaze có tổ chức đầu tiên, và khiến hải quân Nhật không còn khả năng mở thêm một chiến dịch lớn nào trong phần còn lại của cuộc chiến.'},
  bulge:{title:'Trận Ardennes', date:'Tháng 12/1944–1/1945',
    caption:'Đòn tấn công lớn cuối cùng của Đức ở mặt trận phía tây nhằm chia cắt phòng tuyến Đồng Minh; sức kháng cự mạnh dần và thời tiết quang đãng đã bào mòn nó trong sáu tuần.',
    detail:'Đức tập trung lực lượng cho một đòn tấn công bất ngờ xuyên rừng Ardennes, nhằm chia cắt phòng tuyến Đồng Minh và chiếm lại cảng Antwerp. Những bước tiến ban đầu tạo thành một chỗ lồi rõ rệt trên phòng tuyến Đồng Minh, nhưng sức kháng cự mạnh dần, các đơn vị tiếp viện, và thời tiết quang đãng trở lại cho phép không quân Đồng Minh yểm trợ, đã bào mòn đợt tấn công này trong sáu tuần.'},

  yalta:{title:'Hội nghị Yalta', date:'Tháng 2/1945',
    caption:'Roosevelt, Churchill và Stalin gặp nhau để bàn về nước Đức hậu chiến, biên giới Ba Lan, và việc Liên Xô tham chiến chống Nhật.',
    detail:'Khi thất bại của Đức ngày càng chắc chắn, Roosevelt, Churchill và Stalin gặp nhau ở Crimea để bàn về việc phân chia nước Đức hậu chiến, biên giới Ba Lan, cơ cấu của Liên Hợp Quốc, và việc Liên Xô tham chiến chống Nhật trong vòng ba tháng kể từ khi Đức đầu hàng.'},
  'iwo-jima':{title:'Trận Iwo Jima', date:'Tháng 2–3/1945',
    caption:'Thuỷ quân lục chiến Mỹ chiếm hòn đảo kiên cố có giá trị nhờ các sân bay, đối đầu với đơn vị đồn trú Nhật cố thủ trong một hệ thống địa đạo rộng lớn.',
    detail:'Thuỷ quân lục chiến Mỹ đổ bộ lên hòn đảo núi lửa nhỏ này, nơi có giá trị nhờ các sân bay nằm trong tầm bay của máy bay tiêm kích tới Nhật Bản, đối đầu với đơn vị đồn trú Nhật cố thủ trong một hệ thống địa đạo rộng lớn. Gần như toàn bộ đơn vị đồn trú Nhật tử trận, và thương vong của Mỹ cũng rất nặng so với diện tích hòn đảo.'},
  okinawa:{title:'Trận Okinawa', date:'Tháng 4–6/1945',
    caption:'Chiến dịch đổ bộ lớn nhất của Mỹ ở Thái Bình Dương, kéo dài gần ba tháng với các đợt kamikaze liên tục và tổn thất nặng nề cho mọi bên.',
    detail:'Cuộc đổ bộ lên Okinawa, được tính là bàn đạp cho một cuộc tấn công về sau vào chính quốc Nhật Bản, đã hứng chịu các đợt tấn công kamikaze liên tục nhằm vào hạm đội đổ bộ, và gây thương vong nặng nề cho cả binh sĩ Nhật, binh sĩ Đồng Minh lẫn thường dân Okinawa — những con số về sau đã định hình các ước tính về cái giá của việc tấn công trực tiếp vào Nhật Bản.'},
  'berlin-fall':{title:'Berlin thất thủ', date:'Tháng 4–5/1945',
    caption:'Quân Liên Xô bao vây Berlin và đánh qua từng dãy phố; Hitler tự sát, và đơn vị đồn trú thành phố đầu hàng vài ngày sau đó.',
    detail:'Quân Liên Xô bao vây Berlin vào cuối tháng 4/1945 và đánh qua thành phố từng dãy phố một. Khi quân Liên Xô chỉ còn cách hầm trú ẩn của ông vài dãy nhà và không còn hy vọng được giải vây, Hitler tự sát ngày 30/4; đơn vị đồn trú thành phố đầu hàng vài ngày sau đó.'},
  've-day':{title:'Ngày Chiến thắng ở châu Âu — Đức đầu hàng', date:'7–8/5/1945',
